napban is értékes nyereményeket szerezhetsz, ha a dobogón találod magad a verseny végén!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Csatlakozom a bajnoksághoz  \u003cbr>\u003cstrong>Link:\u003c/strong> Hogy miről szól a bajnokság?\u003c/p>\u003chr>\u003ch3 id=\"hu-6-2-udvozlo-dc-regisztracio-utan\">6.2 Üdvözlő (DC regisztráció után)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-welcome\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DevChallengen!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, a regisztrációd sikeres volt a DevChallenge-re!\u003c/p>\u003cp>Tedd próbára magad több programnyelvben és próbáld ki a szórakoztató témaköröket is!\u003c/p>\u003cp>Ne feledd: témánként több kérdéssort is kitölthetsz és akár a barátaidat is kihívhatod, nem beszélve az értékes nyereményekről!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Indulhat a kvízkitöltés!\u003c/p>\u003chr>\u003ch3 id=\"hu-6-3-felhasznaloi-aktivitas-7-napos-aktiv\">6.3 Felhasználói aktivitás (7 napos, aktív)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-user-active\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy (7 nap)\u003c/strong>\u003c/td>\u003ctd>Újabb kvízek várnak a DevChallenge oldalán!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (15 nap)\u003c/strong>\u003c/td>\u003ctd>Visszavárunk a DevChallenge-be!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (30 nap)\u003c/strong>\u003c/td>\u003ctd>Köszönjük, hogy már egy hónapja velünk vagy a DevChallenge-ben!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>7 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Örülünk hogy már egy hete aktív tagja vagy a DevChallenge közösségnek!\u003c/p>\u003cp>És ezidő alatt nem is tétlenkedtél, :total kvízt kitöltöttél már! Kikapcsolódásként próbáld ki szórakoztató kvízeinket is:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>15 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Már tizenöt napja regisztráltál a DevChallenge közösségébe és ezidő alatt :total kvízt töltöttél ki!\u003c/p>\u003cp>Fantasztikus aktivitás! Az eddigi kitöltéseid alapján javasoljuk neked az alábbi kvízeket is:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>30 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Már egy hónap eltelt, mióta csatlakoztál a DevChallenge közösséghez! Külön köszönet azért, hogy ezidő alatt aktívan részt vettél a kvízek kitöltésében is! Ezeket a kvízeinket is próbáltad már?\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üdvözletek:\u003c/strong> Sok sikert! | Jó szórakozást kívánunk! | Alig várjuk, hogy gratulálhassunk neked!\u003c/p>\u003chr>\u003ch3 id=\"hu-6-4-felhasznaloi-aktivitas-inaktiv-felhasznalok\">6.4 Felhasználói aktivitás (inaktív felhasználók)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-user-inactive\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy (7 nap)\u003c/strong>\u003c/td>\u003ctd>Várunk vissza a DevChallenge-be!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (15 nap)\u003c/strong>\u003c/td>\u003ctd>Izgalmas kvízek várnak a DevChallenge-en!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (15 nap v2)\u003c/strong>\u003c/td>\u003ctd>Itt az idő, hogy kipróbáld magad a DevChallenge kvízeivel!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (30 nap)\u003c/strong>\u003c/td>\u003ctd>Már egy hónapja vár a DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>7 napos üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy már egy hete tagja vagy a DevChallenge közösségnek. Szomorúan látjuk, hogy ezidő alatt még csak pár kvízünket töltöttél ki. Az eddigi kitöltéseid alapján úgy gondoljuk, ezek a kvízek is érdekelhetnek:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-6-5-szeriad-veszelyben\">6.5 Szériád veszélyben\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-user-streak\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Veszélyben a szériád!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Tölts ki egy kvízt, hogy ne vesszen el a szériád!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Kitöltök egy kvízt\u003c/p>\u003chr>\u003ch3 id=\"hu-6-6-heti-eredmenyek\">6.6 Heti eredmények\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>dc-weekly-results\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Ilyen volt a heted a DevChallenge-en!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy ezen a héten is aktív voltál a DevChallenge oldalán! Kvízeinkre adott válaszadaiddal a következő eredményeket érted el:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Statisztika formátum:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Válaszaiddal a \u003cstrong>:category\u003c/strong> témakör heti ranglistáján a \u003cstrong>:weekly.\u003c/strong> helyen állsz.\u003c/p>\u003cp>Az örök ranglista helyezésed pedig a héten a következő: \u003cstrong>:alltime.\u003c/strong>\u003c/p>\u003cp>A \u003cstrong>:category\u003c/strong> témakörben \u003cstrong>:quizes\u003c/strong> kvízt töltöttél ki.\u003c/p>\u003cp>Válaszaid jelenlegi pontossága a \u003cstrong>:category\u003c/strong> témakörben: \u003cstrong>:accuracy\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Ösztönző:\u003c/strong> Még jobb eredményekre vágysz? Itt egy kvíz, amivel feljebb juthatsz a rangsorban:  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sok sikert kívánunk neked a jövő hétre is!\u003c/p>\u003chr>\u003ch2 id=\"hu-7-szmd-szeretheto-munkahelyek-dij\">7. SZMD — Szerethető Munkahelyek Díj\u003c/h2>\u003ch3 id=\"hu-7-1-nevezes-visszavonva\">7.1 Nevezés visszavonva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>szmd-redact\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>SZMD:year nevezés visszavonása\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003ca href=\":url\">:company\u003c/a> cég a nevezését visszavonta a :year-es SZMD kapcsán\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-7-2-ujranevezes\">7.2 Újranevezés\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>szmd-renominate\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>SZMD:year újranevezés\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Remek hírünk van: \u003ca href=\":url\">:company\u003c/a> ismét beszállt a versenybe az idei Szerethető Munkahely címért!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-7-3-szmd-promo-kampany\">7.3 SZMD promo kampány\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>szmd-promo\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Szerethető munkahely vagytok? Nevezz már most!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Nyolcadik éve indítjuk útjára a Szerethető Munkahelyek versenyt :szmd_year-ben! Idén 200 magyar cég kapja meg majd a Szerethető Munkahelyek Díjat, melyek közül 8 céget választ majd ki a zsűri szakmai különdíjra.\u003c/p>\u003cp>A Szerethető Munkahelyek verseny idei témája: \u003cstrong>Mi így teszünk egy jobb világért\u003c/strong>. Mutasd meg a szavazóknak, miért jó nálatok dolgozni...\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"hu-8-smart-bench-profile-sbp\">8. Smart Bench Profile (SBP)\u003c/h2>\u003ch3 id=\"hu-8-1-sbp-profil-nyilvanossagba-kerulve\">8.1 SBP profil nyilvánosságba kerülve\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>sbp-b2c\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>😱 Most már közvetlenül is kaphatsz állásajánlatot! Frissítsd a profilod! ☝️ 😉\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Örömmel értesítünk, hogy self-branding profilod bekerült a \u003cstrong>nyilvános, cégek által elérhető adatbázisunkba\u003c/strong>. Így a munkáltatók mostantól \u003cstrong>közvetlenül kereshetnek meg állásajánlataikkal\u003c/strong>. Ezért itt az idő, hogy frissítsd és még vonzóbbá tedd a profilod!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> FRISSÍTEM A PROFILOM  \u003cbr>\u003cstrong>Kikapcsolás opció:\u003c/strong> Ha nem szeretnéd, hogy a profilod közvetlenül elérhető legyen a munkáltatók számára, egy kattintással ki tudod kapcsolni ezt a szolgáltatást a fiókodban!\u003c/p>\u003chr>\u003ch3 id=\"hu-8-2-sbp-pdf-elkeszult\">8.2 SBP PDF elkészült\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>sbp-pdf\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Használd mostantól az egyedi önéletrajzod!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk!\u003c/p>\u003cp>Sikeresen kitöltötted a Self-Branding profilod, így nagyobb eséllyel pályázhatsz álmaid állására!\u003c/p>\u003cp>...ráadásként, elkészítettük neked \u003cstrong>a pdf változatot\u003c/strong> is, amit mostantól bátran használhatsz a hagyományos önéletrajzod helyett akár a :site-on, akár más állásportálon! \u003cstrong>Nézd meg a csatolmányban!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Szlogen:\u003c/strong> Tűnj ki a tömegből és találd meg álmaid állását!  \u003cbr>\u003cstrong>CTA:\u003c/strong> Kattints és mutatkozz be leendő munkaadódnak!\u003c/p>\u003chr>\u003ch3 id=\"hu-8-3-sbp-profil-elkeszult-dj-api\">8.3 SBP profil elkészült (dj-api)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>sbp_profile_created\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Self-Branding profilod elkészült!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szia :name!\u003c/p>\u003cp>A DreamJobs AI-alapú önéletrajz-feldolgozód sikeresen létrehozta a Self-Branding profilodat.\u003c/p>\u003cp>Ha úgy érzed, valami nem stimmel a profilodban, bármikor módosíthatod az adataidat.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Profilom megtekintése\u003c/p>\u003chr>\u003ch3 id=\"hu-8-4-sbp-talent-pool-ingyenes-kredit\">8.4 SBP Talent Pool ingyenes kredit\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>sbp-search-free-credit\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Ajándék: Contact Credit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Jó hírünk van! A megvásárolt Cappuccino / Cappuccino Extra hirdetéseidet amennyiben :date-ig beváltod, akkor Cappuccino esetén 2 db, Cappuccino Extra esetén 4db próba Contact Credit jár, amelyeket a DreamJo.bs Talent Pooljában tudsz felhasználni.\u003c/p>\u003cp>Mi is ez?\u003c/p>\u003cp>A Talent Pool egy \u003cstrong>skill alapú jelöltkereső\u003c/strong>, ahol a preferenciád szerint kereshetsz az aktív álláskeresők anonim bemutatkozói között. A jelölteket elmentheted és ha valakit megkeresnél egy állásajánlattal, akkor egy-egy contact credit beváltásával tudsz majd az adataihoz hozzáférni.\u003c/p>\u003cp>A Contact Creditek \u003cstrong>10-es és 35-ös csomagokban\u003c/strong> lesznek megvásárolhatók a Dashboardon.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-8-5-sbp-talent-pool-launch-ertesito\">8.5 SBP Talent Pool launch értesítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>sbp-search-lunch\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Elindult a DreamJo.bs Talent Pool\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Jó hírünk van! Elindult a DreamJo.bs \u003cstrong>Talent Pool\u003c/strong> &quot;pick and hire&quot; szolgáltatása! Mi is ez? Egy \u003cstrong>skill alapú jelöltkereső\u003c/strong>, ahol a preferenciád szerint kereshetsz az aktív álláskeresők anonim bemutatkozói között...\u003c/p>\u003cp>Bevezető akció: \u003cstrong>2022. április 30-ig\u003c/strong> minden futó \u003cstrong>Cappuccino hirdetéshez 2 db Contact Credit\u003c/strong>, minden futó \u003cstrong>Cappuccino Extra hirdetéshez 4 db Contact Credit\u003c/strong> próba csomagot adunk.\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"hu-9-megosztas-es-meghivok\">9. Megosztás és Meghívók\u003c/h2>\u003ch3 id=\"hu-9-1-link-megosztasa-e-mailben-allas\">9.1 Link megosztása e-mailben (állás)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>share-job\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>:from egy linket küldött neked\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name egy álláshirdetés linket küldött neked a DreamJo.bs oldaláról\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Nézd meg az álláshirdetést\u003c/p>\u003chr>\u003ch3 id=\"hu-9-2-link-megosztasa-e-mailben-ceg\">9.2 Link megosztása e-mailben (cég)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>share-company\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>:from egy linket küldött neked\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name egy cég profil linket küldött neked a DreamJo.bs oldaláról\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Nézd meg a cég profilját\u003c/p>\u003chr>\u003ch3 id=\"hu-9-3-barat-meghivasa-it-kviz\">9.3 Barát meghívása (IT kvíz)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003cem>(a sablonból: \u003ccode>mail.tests_friend_invite\u003c/code>)\u003c/em>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>:from meghívója\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003chr>\u003ch2 id=\"hu-10-ertekelesek\">10. Értékelések\u003c/h2>\u003ch3 id=\"hu-10-1-allas-ertekeles-ertesito\">10.1 Állás értékelés értesítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>job-review\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.jobreviewcreated\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Új javaslat\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>HR és Marketing szempontok szerint szemléztük az álláshirdetést és az alábbi javaslataink lennének:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Módosítom a hirdetésem  \u003cbr>\u003cstrong>Javaslat szöveg:\u003c/strong> Kérlek módosítsd a hirdetésed mihamarabb a nagyobb relevancia és a több jelentkező érdekében.  \u003cbr>\u003cstrong>Köszönet:\u003c/strong> Köszönjük, hogy nálunk hirdetsz!  \u003cbr>\u003cstrong>Segítség:\u003c/strong> Bármi további kérdésed felmerül, keresd a DreamJo.bs kapcsolattartód bizalommal.\u003c/p>\u003chr>\u003ch2 id=\"hu-11-adminisztracio-es-egyeb\">11. Adminisztráció és Egyéb\u003c/h2>\u003ch3 id=\"hu-11-1-gold-profil-erdeklodes-adminnak\">11.1 Gold Profil érdeklődés (adminnak)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003cem>(sablon: \u003ccode>mail.gold_request_to_admin\u003c/code>)\u003c/em>\u003c/p>\u003cp>\u003cem>(Admin belső értesítő — tárgy és tartalom az igénylési adatokból épül fel)\u003c/em>\u003c/p>\u003chr>\u003ch3 id=\"hu-11-2-gold-profil-erdeklodes-igenylonek\">11.2 Gold Profil érdeklődés (igénylőnek)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>gold-request-b2b\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Érdeklődés DreamJobs GOLD Profil iránt\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Örömmel vettük érdeklődésed GOLD Profil szolgáltatásunk iránt.\u003c/p>\u003cp>Kollégánk hamarosan felveszi veled a kapcsolatot, hogy egyeztessétek a részleteket és segítsen a megrendelésben.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-11-3-karrier-tanacsadas-keres-adminnak\">11.3 Karrier tanácsadás kérés (adminnak)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003cem>(sablon: \u003ccode>mail.admin_asked_for_career_advice\u003c/code>)\u003c/em>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Karrier tanácsadás: :name\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cem>(Admin belső értesítő — a felhasználó neve, e-mail, megjegyzés és fájlok tartalmazza)\u003c/em>\u003c/p>\u003chr>\u003ch3 id=\"hu-11-4-candidate-shortlist-megrendeles\">11.4 Candidate Shortlist megrendelés\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003cem>(sablon: \u003ccode>mail.candidate_shortlist\u003c/code>)\u003c/em>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>:name - Candidate Shortlist megrendelés\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cem>(Admin belső értesítő)\u003c/em>\u003c/p>\u003chr>\u003ch3 id=\"hu-11-5-sourcing-ajanlas\">11.5 Sourcing ajánlás\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>csl-recomendation\u003c/code>\u003c/p>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Álláshirdetésed 14 napja fut.\u003c/p>\u003cp>Amennyiben nem vagy elégedett a jelöltekkel, szeretnénk a figyelmedbe ajánlani SOURCING szolgáltatásunkat, melynek segítségével olyan leendő munkatársakat hozunk neked, akik nyitottak az ajánlatotokra.\u003c/p>\u003cp>Ráadásul a hirdetési csomagod árát is visszakaphatod!\u003c/p>\u003cp>Részletekért keresd Rókus az alábbi telefonszámon: +36 70 346 4330\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-11-6-karacsonyi-husveti-promo-egg-hunt-xmas-hunt\">11.6 Karácsonyi/Húsvéti promo (Egg Hunt / Xmas Hunt)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>egghunt\u003c/code> / \u003ccode>xmashunt\u003c/code>\u003c/p>\u003cp>\u003cstrong>Egg Hunt:\u003c/strong>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>EGGHUNT akció!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A húsvéti &quot;EGGHUNT&quot; akció keretén belül, \u003cstrong>:discount%-os kupon\u003c/strong> használatára vagy jogosult.\u003c/p>\u003cp>Kuponkódod: \u003cstrong>:coupon\u003c/strong>\u003c/p>\u003cp>Kupon felhasználható \u003cstrong>Latte, Cappuccino, vagy Cappuccino Extra\u003c/strong> hirdetésekre \u003cstrong>2023 április 25-ig\u003c/strong>.\u003c/p>\u003cp>Nincs most épp nyitott pozíció Nálatok? Semmi gond! A kedvezményesen megvásárolt csomagodat \u003cstrong>6 hónapig tudod felhasználni\u003c/strong>.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Kellemes Húsvétot kívánunk\u003c/p>\u003chr>\u003cp>\u003cstrong>Xmas Hunt (cégeknek):\u003c/strong>\u0 anuri de Job și Facturare\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#4-gestionarea-companiei\">Gestionarea Companiei\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#5-engagement-utilizatori-și-marketing\">Engagement Utilizatori și Marketing\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#6-devchallenge\">DevChallenge\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#7-locuri-de-muncă-iubibile-szmdelivrable-workplaces\">Locuri de Muncă Iubibile (SZMD/Lovable Workplaces)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#8-smart-bench-profile-sbp\">Smart Bench Profile (SBP)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#9-distribuire-și-invitații\">Distribuire și Invitații\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#10-recenzii\">Recenzii\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#11-administrare-și-altele\">Administrare și Altele\u003c/a>\u003c/li>\u003c/ol>\u003chr>\u003ch2 id=\"ro-1-inregistrare-si-autentificare\">1. Înregistrare și Autentificare\u003c/h2>\u003ch3 id=\"ro-1-1-email-de-bun-venit-dj-utilizator-dashboard\">1.1 Email de bun venit (dj — utilizator dashboard)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.welcome\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe Dreamjobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bine ai venit! Noi, cei de la DreamJobs suntem foarte bucuroși, că ești alături de noi!\u003c/p>\u003cp>Sperăm, că vei găsi rapid ceea ce dorești: muncă flexibilă, un office captivant, sau pur și simplu un salariu mai bun.\u003c/p>\u003cp>Îți arătăm, unde găsești cele mai bune joburi:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Semnătură:\u003c/strong> Ținem pumnii, îți dorim succes în căutarea jobului perfect!\u003c/p>\u003chr>\u003ch3 id=\"ro-1-2-email-de-bun-venit-dj-api-inregistrare-job-seeker\">1.2 Email de bun venit (dj-api — înregistrare job seeker)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bun venit la DreamJobs, ne bucurăm că ești alături de noi!\u003c/p>\u003cp>Suntem siguri că vei găsi noul tău loc de muncă de vis în curând - fie că este vorba de un program de lucru flexibil, de o echipă sudată sau de oportunitatea de a avansa în carieră.\u003c/p>\u003cp>Aruncă o privire în culisele companiilor și alege din pozițiile care ți se potrivesc:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Bloc promo Self-Branding:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dorim să te sprijinim eficient în căutarea unui loc de muncă, de aceea am creat soluția noastră unică pentru căutarea unui job. Profilul tău de Self-Branding te ajută să ieși în evidență față de alți candidați și să îți prezinți candidatura într-un mod autentic și convingător. Folosește instrumentele noastre creative pentru a arăta ce abilități te definesc și ce te face unic!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Văd joburile disponibile | Îmi creez profilul Self-Branding  \u003cbr>\u003cstrong>Urare:\u003c/strong> Îți ținem pumnii, mult succes în căutarea jobului perfect!  \u003cbr>\u003cstrong>Ajutor:\u003c/strong> Dacă te putem ajuta cu orice informație, scrie-ne un mail pe business@dreamjobs.ro.\u003c/p>\u003chr>\u003ch3 id=\"ro-1-3-email-de-bun-venit-dj-api-ro-market-varianta-specifica\">1.3 Email de bun venit (dj-api — RO market, variantă specifică)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/ro-mail.php\u003c/code> → \u003ccode>welcome\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs Romania!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bine ai venit! Suntem foarte bucuroși, că ești alături de noi!\u003c/p>\u003cp>Sperăm că vei găsi ceea ce dorești fie că este vorba de un program de lucru flexibil, de un birou pet friendly sau pur și simplu de un salariu atractiv.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Ajutor:\u003c/strong> business@dreamjobs.ro  \u003cbr>\u003cstrong>Urare:\u003c/strong> Îți ținem pumnii, îți dorim succes în căutarea jobului perfect!\u003c/p>\u003chr>\u003ch3 id=\"ro-1-4-confirmare-adresa-email\">1.4 Confirmare adresă email\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code> | \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.email_validation\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Confirmă-ți adresa de e-mail\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai reușit să te înregistrezi! Mai ai un singur pas, te rugăm să confirmi adresa de email dând clic pe linkul de mai jos:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-1-5-solicitare-resetare-parola-dj-dashboard\">1.5 Solicitare resetare parolă (dj — dashboard)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>password-reset.request\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.passwordresetrequest\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Parolă uitată\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Titlu\u003c/strong>\u003c/td>\u003ctd>Schimbă parola\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Se pare că ai uitat parola profilului tău DreamJobs Romania.\u003c/p>\u003cp>Nicio problemă, introdu o nouă parolă aici:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-1-6-parola-schimbata-dj-dashboard\">1.6 Parolă schimbată (dj — dashboard)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>password-reset.success\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Parola ta a fost schimbată\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ți-ai schimbat cu succes parola profilului tău DreamJobs Romania.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-1-7-resetare-parola-dj-api-job-seeker\">1.7 Resetare parolă (dj-api — job seeker)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>password-reset\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/password-reset.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Resetarea parolei\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți trimitem acest e-mail deoarece am primit o solicitare de resetare a parolei pentru contul tău.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Resetează parola  \u003cbr>\u003cstrong>Informație:\u003c/strong> Dacă nu ai solicitat resetarea parolei, nu este necesară nicio acțiune suplimentară.  \u003cbr>\u003cstrong>Avertisment:\u003c/strong> Acest link de resetare a parolei va expira în :count minute.\u003c/p>\u003chr>\u003ch3 id=\"ro-1-8-cod-otp-cod-de-autentificare\">1.8 Cod OTP (cod de autentificare)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>otp\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/otp.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Cod de autentificare\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Folosește următorul cod din 6 cifre pentru a te autentifica în contul tău:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Avertisment:\u003c/strong> Acest cod este valabil :count minute.  \u003cbr>\u003cstrong>Informație:\u003c/strong> Dacă nu ai solicitat acest cod, te rugăm să ignori acest mesaj.\u003c/p>\u003chr>\u003ch3 id=\"ro-1-9-confirmare-abonare-la-notificari-de-joburi\">1.9 Confirmare abonare la notificări de joburi\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>job-notification\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/job-notification.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ești abonat la alerta de joburi DreamJobs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dragă :name,\u003c/p>\u003cp>Te-ai abonat cu succes la newsletter-ul nostru de alerte de joburi, deci ești cu un pas mai aproape de a-ți găsi noul loc de muncă.\u003c/p>\u003cp>De acum înainte, îți vom trimite alerte de joburi personalizate pe baza ariei de interes selectate, pentru a te ajuta să găsești mai rapid următoarea ta mare oportunitate - fie că este vorba de un program de lucru flexibil, de un mediu de lucru inspirațional, de un birou pet-friendly sau de un pachet de beneficii mai atractiv.\u003c/p>\u003cp>Parola ta temporară de acces: \u003cstrong>:pw\u003c/strong>\u003c/p>\u003cp>Dacă simți că primești prea multe notificări, poți accesa cu ușurință setările tale, fie dând clic pe butonul Dezabonare din josul e-mailurilor noastre, fie CLICK AICI.\u003c/p>\u003cp>În caz de întrebări, nu ezita să ne contactezi la :address.\u003c/p>\u003cp>Îți dorim mult succes în căutarea jobului ideal!\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"ro-2-aplicatii-la-joburi\">2. Aplicații la Joburi\u003c/h2>\u003ch3 id=\"ro-2-1-aplicatie-reusita-b2c-confirmare-pentru-candidat-dj\">2.1 Aplicație reușită (B2C — confirmare pentru candidat, dj)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>applied-to-job\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.applied_to_job\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Felicitări! Ai aplicat cu succes la jobul: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai aplicat cu succes la poziția \u003cstrong>:job\u003c/strong> la compania \u003cstrong>:company\u003c/strong> prin DreamJobs.\u003c/p>\u003cp>Compania a primit aplicația ta, te rugăm să ai răbdare! Dacă ai întrebări, scrie-ne la: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Date partajate:\u003c/strong> Am partajat cu ei următoarele informații, pentru a putea să te contacteze.\u003c/p>\u003cp>\u003cstrong>Promo SBP:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Știai că poți aplica la joburi și cu un profil de Self-branding la noi? Din 10 aplicații, în medie se acordă doar 2 interviuri. Îți mărești șansele prin profilul Self-branding - completează-l și aplică simplu data viitoare!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-uri:\u003c/strong>\u003c/p>\u003cul>\u003cli>Uită-te la companiile la care recrutarea nu s-a oprit!\u003c/li>\u003cli>Aplică și la celelalte joburi similare ale noastre!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Urare:\u003c/strong> Mult succes la căutarea jobului!\u003c/p>\u003chr>\u003ch3 id=\"ro-2-2-aplicatie-reusita-b2c-confirmare-pentru-candidat-dj-api\">2.2 Aplicație reușită (B2C — confirmare pentru candidat, dj-api)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>application-b2c\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/application_b2c.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Felicitări! Ai aplicat cu succes la jobul: :company @ :job\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (fără companie)\u003c/strong>\u003c/td>\u003ctd>Felicitări! Ai aplicat cu succes la jobul: :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj (standard):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai aplicat cu succes la poziția \u003cstrong>:job\u003c/strong> la compania \u003cstrong>:company\u003c/strong> prin DreamJobs.\u003c/p>\u003cp>Compania a primit aplicația ta, te rugăm să ai răbdare! Dacă ai întrebări, scrie-ne la: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj (fără companie — hide_company):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, ai aplicat cu succes la poziția \u003cstrong>:job\u003c/strong> prin DreamJobs.\u003c/p>\u003cp>Compania a primit aplicația ta, te rugăm să ai răbdare!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Recomandare parolă (pentru utilizatorii noi):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Trebuie doar să introduci o parolă și înregistrarea ta la DreamJobs este completă. Ulterior, vei putea aplica ușor la joburi și vei putea vizualiza oricând aplicațiile tale anterioare.\u003c/p>\u003cp>Pentru a introduce o parolă și a finaliza înregistrarea ta DreamJobs, folosește linkul următor: link\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Promo SBP:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Știai că poți aplica la joburi și cu un profil de Self-branding la noi? Din 10 aplicații, în medie se acordă doar 2 interviuri. Îți mărești șansele prin profilul Self-branding - completează-l și aplică simplu data viitoare!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-uri:\u003c/strong> Uită-te la companiile la care recrutarea nu s-a oprit! | Aplică și la celelalte joburi similare ale noastre!  \u003cbr>\u003cstrong>Urare:\u003c/strong> Mult succes la căutarea jobului!\u003c/p>\u003chr>\u003ch3 id=\"ro-2-3-notificare-nou-candidat-b2b-pentru-companie-dj-api\">2.3 Notificare nou candidat (B2B — pentru companie, dj-api)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>application-b2b\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/application_b2b.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Candidat nou\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Avem vești grozave, \u003cstrong>:name\u003c/strong> a aplicat la poziția \u003cstrong>:job\u003c/strong> @ \u003cstrong>:company\u003c/strong>!!\u003c/p>\u003cp>Vizualizați datele de candidatură și CV-ul lui \u003cstrong>:name\u003c/strong>!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Candidații jobului  \u003cbr>\u003cstrong>PS:\u003c/strong> Vă rugăm să îi trimiteți un răspuns în orice caz, chiar dacă candidatura nu este relevantă pentru acest job! Acest lucru este important nu numai pentru candidat, ci și pentru compania dvs. - un feedback adecvat face parte dintr-un brand angajator puternic.  \u003cbr>\u003cstrong>Notă GDPR:\u003c/strong> Vă rugăm să tratați datele candidaților primite în acest e-mail cu confidențialitate, în conformitate cu reglementările privind protecția datelor (GDPR) aplicabile.\u003c/p>\u003chr>\u003ch3 id=\"ro-2-4-aplicatie-respinsa\">2.4 Aplicație respinsă\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>application-rejected\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.application_rejected\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Rezultatul candidaturii: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ne pare rău să te anunțăm că candidatura ta la poziția \u003cstrong>:job\u003c/strong> la compania \u003cstrong>:company\u003c/strong> nu a fost selectată.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Încurajare:\u003c/strong> Nu renunța! Te așteaptă alte oferte interesante de joburi care poate se potrivesc mai bine abilităților și obiectivelor tale de carieră.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Văd joburile disponibile  \u003cbr>\u003cstrong>Urare:\u003c/strong> Mult succes la căutarea jobului!\u003c/p>\u003chr>\u003ch3 id=\"ro-2-5-chestionar-dupa-aplicare-la-job\">2.5 Chestionar după aplicare la job\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>applied-to-job-survey\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.applied_to_job_survey\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Abia așteptăm să auzim despre experiența ta de aplicare la job! :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți mulțumim că ai aplicat la un job prin site-ul nostru!\u003c/p>\u003cp>Suntem curioși să auzim experiența ta, te rugăm să completezi acest scurt chestionar, ajută-ne cu munca noastră!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Completez chestionarul\u003c/p>\u003chr>\u003ch3 id=\"ro-2-6-aplicatie-incompleta-memento\">2.6 Aplicație incompletă — memento\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>unfinished-job-application\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Continuați să aplicați\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dragă :name,\u003c/p>\u003cp>Se pare că încă nu ai finalizat aplicația ta pentru acest job. Nu uita să o trimiți înainte de expirarea anunțului!\u003c/p>\u003cp>:job_name\u003c/p>\u003cp>[LINK]\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"ro-3-planuri-de-job-si-facturare\">3. Planuri de Job și Facturare\u003c/h2>\u003ch3 id=\"ro-3-1-job-publicat-dupa-plata-in-asteptare\">3.1 Job publicat (după plată în așteptare)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>plan-pending-created\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Anunț de job publicat\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Am publicat anunțul tău de job în pachetul selectat. Factura finală va fi trimisă prin e-mail, de obicei în termen de 1 zi, după procesarea cu succes a plății cu cardul.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-3-2-plata-cu-cardul-reusita\">3.2 Plată cu cardul reușită\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>plan-pending-success\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Plată cu card reușită\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Plata cu cardul a fost reușită. Îți trimitem factura atașată.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-3-3-plata-cu-cardul-refuzata\">3.3 Plată cu cardul refuzată\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>plan-pending-failed\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Plată cu cardul refuzată\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Debitarea cardului bancar a eșuat, furnizorul a refuzat plata cu cardul. Anunțul tău a fost mutat în pachetul fără cofeină.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-3-4-pachet-de-anunturi-expira-in-curand\">3.4 Pachet de anunțuri expiră în curând\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>job-expires\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Pachetul tău de anunțuri expiră în o săptămână\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Pachetul asociat cu jobul următor expiră în 1 săptămână: \u003cstrong>:job @ :company\u003c/strong>.\u003c/p>\u003cp>În prezent, jobul rulează în pachetul \u003cstrong>:plan\u003c/strong> până la data \u003cstrong>:date\u003c/strong>.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Uită-te la candidați și dă-le feedback!\u003c/p>\u003chr>\u003ch3 id=\"ro-3-5-pachet-de-anunturi-expirat\">3.5 Pachet de anunțuri expirat\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>job-expired\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Pachetul tău de anunțuri a expirat\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Pachetul \u003cstrong>:plan\u003c/strong> pentru jobul următor a expirat: \u003cstrong>:job @ :company\u003c/strong>.\u003c/p>\u003cp>Jobul tău va fi închis automat. Vei putea oricând vizualiza candidaturile. Jobul închis poate fi republicat oricând.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-uri:\u003c/strong>\u003c/p>\u003cul>\u003cli>Dacă mai cauți colegul ideal, alege un nou pachet pentru job!\u003c/li>\u003cli>Dacă l-ai găsit, închide jobul!\u003c/li>\u003c/ul>\u003chr>\u003ch3 id=\"ro-3-6-job-inchis-automat\">3.6 Job închis automat\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>job-autoclose\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ți-am închis jobul\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Cu două săptămâni în urmă, pachetul \u003cstrong>:plan\u003c/strong> pentru jobul următor a expirat: \u003cstrong>:job @ :company\u003c/strong>.\u003c/p>\u003cp>După aceea, jobul tău a fost vizibil pe site-ul DreamJobs încă 2 săptămâni, dar astăzi l-am închis automat.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Dacă dorești să mai publici jobul, apasă aici:\u003c/p>\u003chr>\u003ch3 id=\"ro-3-7-job-inchis-notificare-b2b\">3.7 Job închis (notificare B2B)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>closedjob\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Anunț inchis\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Salut, jobul tău :jobname s-a încheiat.\u003c/p>\u003cp>Notifică-ți candidații despre stadiul actual al recrutării cu un mesaj automat pe pagina Gestionare job închis.\u003c/p>\u003cp>Te rugăm să ne oferi feedback dacă ai găsit candidatul potrivit!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-3-8-job-inchis-notificare-candidati\">3.8 Job închis — notificare candidați\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>closed-job-page.mail-text\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>\u003cem>(definit în șablon)\u003c/em>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dragă Candidat,\u003c/p>\u003cp>Anterior ai candidat la poziția \u003cstrong>:job @ :company\u003c/strong>.\u003c/p>\u003cp>Anunțul de job s-a închis. Dacă ești considerat potrivit pentru poziție, vei fi contactat în curând.\u003c/p>\u003cp>Între timp, uită-te la ofertele noastre actuale de joburi! »\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-3-9-oferta-upgrade-pachet-de-job\">3.9 Ofertă upgrade pachet de job\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>job-plan-upgrade\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Raport periodic DreamJobs :job - Opțiune upgrade\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Vă informăm că, conform recomandărilor noastre, \u003cstrong>acest tip și nivel de seniority al jobului este cel mai bine publicat în pachetul următor:\u003c/strong> :plans\u003c/p>\u003cp>Mai multe informații despre pachetele de publicare: LISTA DE PREȚURI\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Opțiuni:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>UPGRADE:\u003c/strong> Cumpărați un anunț mai mare! Opriți \u003cstrong>în 7 zile\u003c/strong>, duplicați, republicați în pachetul mai mare! Veți primi valoarea anunțului oprit sub formă de cupon de reducere.\u003c/p>\u003cp>\u003cstrong>REPUBLICARE DUPĂ EXPIRARE:\u003c/strong> Cumpărați un anunț mai mare \u003cstrong>ACUM\u003c/strong>, utilizați-l în decurs de 6 luni!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Pachete recomandate:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>- \u003cstrong>Espresso:\u003c/strong> 3.500 - 5.000 reach (pentru joburi de nivel entry, junior general)\u003c/p>\u003cp>- \u003cstrong>Latte:\u003c/strong> 20.000 - 30.000 reach (IT Junior, alte joburi nivel Medior)\u003c/p>\u003cp>- \u003cstrong>Cappuccino:\u003c/strong> 50.000 - 70.000 reach (IT Medior și Senior, alte joburi Senior)\u003c/p>\u003cp>- \u003cstrong>Cappuccino Extra:\u003c/strong> 100.000 - 140.000 reach (pentru poziții IT dificile, căutare continuă)\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> CUMPĂRARE ANUNȚ NOU CU REDUCERE  \u003cbr>\u003cstrong>Mulțumire:\u003c/strong> Vă mulțumim că publicați pe DreamJobs!\u003c/p>\u003chr>\u003ch3 id=\"ro-3-10-factura-noua\">3.10 Factură nouă\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>new-invoice\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Factură nouă\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ai primit o factură nouă.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Notă:\u003c/strong> Factura o găsești și atașată la e-mail.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Poți vizualiza facturile tale aici — Facturi companie\u003c/p>\u003chr>\u003ch3 id=\"ro-3-11-factura-proforma-noua\">3.11 Factură proformă nouă\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>new-proforma-invoice\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Factură proformă nouă\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ai primit o factură proformă nouă. Achit-o cât mai curând, pentru a putea începe să căutăm noul tău coleg ideal!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Notă:\u003c/strong> Factura proformă o găsești și atașată la e-mail.\u003c/p>\u003chr>\u003ch3 id=\"ro-3-12-factura-proforma-expira-in-curand\">3.12 Factură proformă expiră în curând\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>payment-expires\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Termenul de plată pentru factura proformă va expira în curând\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Atenție, termenul de plată al uneia dintre facturile tale proforma expiră în 3 zile.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Notă:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Factura proformă o găsești atașată.\u003c/p>\u003cp>După ce suma va fi achitată, te vom anunța și anunțul tău va deveni activ pe DreamJobs Romania.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-3-13-factura-proforma-expirata\">3.13 Factură proformă expirată\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>payment-expired\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Factura proformă a expirat\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Din păcate, termenul de plată al uneia dintre facturile tale proforma a expirat.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Informație:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Această factură proformă nu mai poate fi plătită.\u003c/p>\u003cp>Dacă a apărut o eroare și ai plătit deja factura proformă, te rugăm să ne contactezi la: :email\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-3-14-pachet-achizitionat-disponibil\">3.14 Pachet achiziționat disponibil\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>payment-settled\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Pachetele achiziționate sunt acum disponibile.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ai achiziționat cu succes pachetul/pachetele - :packages! Acesta este acum disponibil pe profilul tău până la data :date.\u003c/p>\u003cp>Pentru a le utiliza, conectează-te la profilul tău, deschide anunțul pe care dorești să îl activezi și, sub pachetele disponibile, selectează pachetul/pachetele pe care dorești să le folosești făcând clic pe &quot;folosește&quot;.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-3-15-cupon-ppc-utilizat\">3.15 Cupon PPC utilizat\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>used-pp-coupon\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ai cumpărat cu succes 1 buc. anunț :coupon\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>La :date, ai cumpărat cu succes 1 buc. anunț \u003cstrong>:coupon\u003c/strong> pentru jobul următor:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Info suplimentar:\u003c/strong>\u003c/p>\u003cul>\u003cli>Numărul de anunțuri suplimentare disponibile:\u003c/li>\u003cli>Cupoanele tale de reducere:\u003c/li>\u003cli>\u003cstrong>CTA:\u003c/strong> Clic AICI pentru a cumpăra alte anunțuri!\u003c/li>\u003c/ul>\u003chr>\u003ch3 id=\"ro-3-16-cupon-expira-in-curand\">3.16 Cupon expiră în curând\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>coupon-expire\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Te-ai uitat de reducere?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Cuponul tău este trist... te-ai uitat de el? :(\u003c/p>\u003cp>Cuponul tău este valabil doar până mâine la miezul nopții (:date). Nu rata reducerea!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Promo:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>NU AI O POZIȚIE DESCHISĂ ACUM?\u003c/p>\u003cp>Plătește mai puțin acum și folosește anunțul în următoarele 6 luni, când este actual!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Apasă aici pentru a cumpăra\u003c/p>\u003chr>\u003ch2 id=\"ro-4-gestionarea-companiei\">4. Gestionarea Companiei\u003c/h2>\u003ch3 id=\"ro-4-1-companie-inregistrata\">4.1 Companie înregistrată\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>company-registered\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.company-registered\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj (piața RO):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Salut!\u003c/p>\u003cp>Te-ai înregistrat cu succes și ești cu un pas mai aproape de a găsi cei mai potriviți candidați.\u003c/p>\u003cp>👉 Ca prim pas, creează și publică profilul companiei tale...\u003c/p>\u003cp>Îți mulțumim că ai ales DreamJobs!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-4-2-invitatie-editor-companie-utilizator-existent\">4.2 Invitație editor companie (utilizator existent)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>manager-added\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Invitație ca editor al companiei\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>:name\u003c/strong> te-a invitat ca editor al companiei \u003cstrong>:company\u003c/strong>.\u003c/p>\u003cp>Apasă aici pentru a accepta invitația și să înceapă distracția!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-4-3-activare-cont-manager-nou-creat\">4.3 Activare cont (manager nou creat)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>added-manager\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.activateaddedaccount\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Invitație ca editor al companiei: :company\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name te-a invitat ca editor la compania \u003cstrong>:company\u003c/strong>.\u003c/p>\u003cp>Apasă aici pentru a activa profilul tău și să înceapă distracția!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-4-4-drepturi-de-editor-revocate\">4.4 Drepturi de editor revocate\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>manager-remove\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Nu mai ești editorul companiei :company\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Am crezut că ar trebui să știi: de acum înainte nu mai ești editorul companiei \u003cstrong>:company\u003c/strong>.\u003c/p>\u003cp>Profilul tău de pe DreamJobs va fi accesibil în continuare:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-4-5-profil-editor-activat\">4.5 Profil editor activat\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>manager-activated\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ți-am activat profilul de editor\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ți-ai activat cu succes profilul de editor.\u003c/p>\u003cp>Poți începe deja să editezi profilul companiei și să publici anunțuri de joburi!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Ghid:\u003c/strong> Am publicat un ghid în care am rezumat de ce vei avea nevoie pentru a-ți compune profilul de companie.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Ghid: Structura profilului de companie  \u003cbr>\u003cstrong>Dashboard:\u003c/strong> Descoperă panoul de control — acesta este sufletul tuturor!  \u003cbr>\u003cstrong>Urare:\u003c/strong> Spor la treabă, sperăm că veți găsi curând noul vostru coleg grozav!\u003c/p>\u003chr>\u003ch3 id=\"ro-4-6-email-de-bun-venit-manager-standard\">4.6 Email de bun venit manager (standard)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>manager-welcome\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ți-ai înregistrat cu succes contul de editor.\u003c/p>\u003cp>Poți începe deja să editezi profilul companiei și să publici anunțuri de joburi!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-4-7-email-de-bun-venit-manager-campanie-szmd\">4.7 Email de bun venit manager (campanie SZMD)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>manager-welcome-szmd\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs - căutăm Locuri de muncă iubibile din România! 🤍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ne bucurăm că ești alături de noi! Ți-ai înregistrat cu succes contul de editor pe DreamJobs!\u003c/p>\u003cp>\u003cstrong>Care este pasul următor?\u003c/strong>\u003c/p>\u003cp>1. \u003cstrong>Creează-ți profilul de companie\u003c/strong>: Folosește diferite servicii prin intermediul panoului de control.\u003c/p>\u003cp>2. \u003cstrong>Publică primul tău anunț\u003c/strong>: Profitați de avantajele și serviciile DreamJobs.\u003c/p>\u003cp>3. \u003cstrong>Bucurați-vă de avantajele DreamJobs\u003c/strong>\u003c/p>\u003cp>Ca nou înregistrat, dorim să te surprindem cu \u003cstrong>un cupon de 50% reducere unic\u003c/strong>, pentru a valorifica la maximum primul tău anunț!\u003c/p>\u003cp>Cuponul de reducere poate fi utilizat pentru pachetele noastre de anunțuri \u003cstrong>Espresso, Latte, Cappuccino și Cappuccino Extra\u003c/strong> în termen de \u003cstrong>o lună\u003c/strong>.\u003c/p>\u003cp>\u003cstrong>Locuri de Muncă Iubibile :szmd_year: Misiunea noastră pentru un viitor mai bun\u003c/strong>\u003c/p>\u003cp>Cu profilul tău de companie publicat, te poți înregistra gratuit la concursul nostru Locuri de Muncă Iubibile...\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-4-8-oportunitate-articol-blog-companie\">4.8 Oportunitate articol blog companie\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>company-blog-post\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>DreamJobs oportunitate de articol joburi de vis :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Introducere:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți mulțumim că publici la noi! Referitor la opțiunea articol de blog inclusă în anunțul :coupon pe care tocmai l-ai lansat, te contactăm în legătură cu următorul anunț de job:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Pentru a obține un număr eficient de candidați, este recomandat să valorifici oportunitatea oferită de rubrica DreamJobs Joburi de Vis. Experiența arată că articolul de blog crește numărul de candidați cu o medie de \u003cstrong>10-15%\u003c/strong> în plus...\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-4-9-confirmare-stergere-profil\">4.9 Confirmare ștergere profil\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code> | \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect (dj)\u003c/strong>\u003c/td>\u003ctd>Ștergerea datelor din sistemul DreamJobs Romania\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (dj-api)\u003c/strong>\u003c/td>\u003ctd>Ștergerea datelor utilizatorului din sistemul DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj (dj):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Procesul de ștergere a datelor pentru utilizatorul cu adresa de email :email a fost inițiat la cererea ta.\u003c/p>\u003cp>Procesul complet poate dura până la 30 de zile.\u003c/p>\u003cp>În această perioadă, datele și înregistrările asociate utilizatorului vor fi eliminate din DreamJobs și din sistemele sale conexe.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj (dj-api):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Procesul de ștergere a datelor asociate contului cu adresa de e-mail :email din sistemul DreamJobs a fost inițiat conform solicitării tale. Pe durata acestui proces, datele și înregistrările corespunzătoare vor fi eliminate din DreamJobs.\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"ro-5-engagement-utilizatori-si-marketing\">5. Engagement Utilizatori și Marketing\u003c/h2>\u003ch3 id=\"ro-5-1-recomandari-de-joburi-zilnic\">5.1 Recomandări de joburi (zilnic)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>recommended-jobs\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>joburi noi pentru tine\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bună dimineața! O nouă zi, o nouă oportunitate!\u003c/p>\u003cp>Pe baza categoriilor marcate, credem că următoarele joburi pot fi de interes pentru tine\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Notă:\u003c/strong> Modifică categoriile de interese AICI.\u003c/p>\u003chr>\u003ch3 id=\"ro-5-2-recomandari-de-joburi-saptamanal\">5.2 Recomandări de joburi (săptămânal)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>recommended-jobs-weekly\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Vrei să-ți dezvolți abilitățile la un job nou?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Săptămâna aceasta îți aduce noi oportunități!\u003c/p>\u003cp>Pe baza categoriilor marcate pe profilul tău, credem că următoarele joburi pot fi interesante pentru tine:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-5-3-memento-job-salvat\">5.3 Memento job salvat\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>saved-job-reminder\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Încă poți aplica!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Anterior ai salvat cu succes job-ul de mai jos:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Avertisment:\u003c/strong> Termenul de înregistrare expiră curând. Nu rata jobul tău de vis, aplică chiar azi!\u003c/p>\u003chr>\u003ch3 id=\"ro-5-4-job-salvat-notificare\">5.4 Job salvat (notificare)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>saved-job\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>\u003cem>(valoare HU: Mentett állás — necesită traducere RO)\u003c/em>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Mulțumim că ești interesat de poziția deschisă, poți finaliza aplicația ta făcând clic pe următorul link:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-5-5-newsletter-b2b\">5.5 Newsletter B2B\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>b2b-newsletter\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>🦩 Hai să lansăm vara cu reduceri! ⛱️\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>În sfârșit vine vara, în sfârșit vacanța și în sfârșit 🌴 \u003cstrong>ACȚIUNEA DE VARĂ DREAMJOBS\u003c/strong>! 🌊\u003c/p>\u003cp>Intră în profilul companiei tale, caută cuponul \u003cstrong>Nyarindito25\u003c/strong> în tabloul de bord și folosește-ți reducerea de 25% la pachetele noastre Latte, Cappuccino sau Cappuccino Extra!\u003c/p>\u003cp>Durata promoției: 16-20 iunie 2022.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Spre tabloul de bord!\u003c/p>\u003chr>\u003ch3 id=\"ro-5-6-virtual-bench-notificare-confirmare-abonare\">5.6 Virtual Bench notificare (confirmare abonare)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>virtualbench\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Aș lucra aici!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ai lucra aici? Prin abonarea la compania \u003cstrong>:company\u003c/strong>, vei primi primul notificări despre noile oferte de joburi disponibile aici.\u003c/p>\u003cp>Îți poți gestiona companiile favorite din contul tău personal, la secțiunea de profil.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Urare:\u003c/strong> Vizionare plăcută și îți dorim mult succes în găsirea echipei care te așteaptă!\u003c/p>\u003chr>\u003ch3 id=\"ro-5-7-virtual-bench-newsletter-cerere-preferinte\">5.7 Virtual Bench newsletter (cerere preferințe)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>virtualbench-newsletter\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ți-ar plăcea să lucrezi la ei? Completează ce domeniu te interesează!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Anterior ai indicat că ți-ar plăcea să lucrezi ca și coleg al companiei \u003cstrong>:company\u003c/strong>.\u003c/p>\u003cp>Completează sau actualizează-ți profilul cu informațiile despre domeniul și nivelul de poziție care te interesează, pentru a le putea transmite și companiei!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Accesez profilul meu!\u003c/p>\u003chr>\u003ch3 id=\"ro-5-8-virtual-bench-newsletter-v2\">5.8 Virtual Bench newsletter v2\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>virtualbench-newsletter-2\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ai lucra aici? Ce domeniu te-ar interesa?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ți-ai arătat interesul să lucrezi aici:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Completare:\u003c/strong> Pentru ca firma să îți ofere o oportunitate de muncă relevantă, te rugăm să introduci în profilul tău ce domenii și ce nivel de poziție te-ar interesa!  \u003cbr>\u003cstrong>Notă:\u003c/strong> *Datele tale personale nu, doar preferințele tale vor fi transmise companiei.\u003c/p>\u003chr>\u003ch3 id=\"ro-5-9-virtual-bench-notificare-job-nou\">5.9 Virtual Bench — Notificare job nou\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>virtualbench-new-job\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>\u003cem>(definit în șablon)\u003c/em>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Titlu\u003c/strong>\u003c/td>\u003ctd>Ai lucra aici?\u003c/td>\u003c/tr>\u003c/tbody>\u003c
