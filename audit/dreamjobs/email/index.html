d="backToCatalog">Vissza a katalógushoz</button></div><article class="doc-content" id="docContent"></article></main></section></div><script>
const fullDocuments={"audit":{"label":"Technikai audit","html":"\u003ch1 id=\"audit-email-notification-ecosystem-audit\">Email Notification Ecosystem Audit\u003c/h1>\u003cblockquote>\u003cp>\u003cstrong>Platform:\u003c/strong> DreamJobs (HU/RO)\u003c/p>\u003cp>\u003cstrong>Audit Date:\u003c/strong> 2026-05-26\u003c/p>\u003cp>\u003cstrong>Scope:\u003c/strong> \u003ccode>dj\u003c/code> (Dashboard), \u003ccode>dj-api\u003c/code> (Backend API), \u003ccode>dj-nuxt\u003c/code> (Frontend)\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"audit-table-of-contents\">Tartalomjegyzék\u003c/h2>\u003col class=\"audit-simple-toc\">\u003cli>\u003ca href=\"#audit-4-1-authentication-onboarding\">Regisztráció és Hitelesítés\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-2-job-applications\">Állásjelentkezések\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-3-job-plans-billing\">Állástervek és Számlázás\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-4-company-management\">Cégkezelés\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-5-user-engagement-marketing\">Felhasználói Engagement és Marketing\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-6-devchallenge-dc-feature\">DevChallenge\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-7-szmd-year-s-best-employer\">SZMD – Szerethető Munkahelyek Díj\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-8-smart-bench-profile-sbp\">Smart Bench Profile (SBP)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-9-sharing-referrals\">Megosztás és Meghívók\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-10-reviews\">Értékelések\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#audit-4-11-admin-miscellaneous\">Adminisztráció és Egyéb\u003c/a>\u003c/li>\u003c/ol>\u003chr>\u003ch2 id=\"audit-1-executive-summary\">1. Executive Summary\u003c/h2>\u003ch3 id=\"audit-architecture\">Architecture\u003c/h3>\u003cp>Email delivery across the platform is handled by \u003cstrong>two independent Laravel backends\u003c/strong> (\u003ccode>dj\u003c/code> and \u003ccode>dj-api\u003c/code>), both of which use the \u003cstrong>Laravel Notification / Mailable\u003c/strong> system. The frontend (\u003ccode>dj-nuxt\u003c/code>) acts purely as a \u003cstrong>BFF (Backend-for-Frontend) proxy\u003c/strong> — it never sends email directly; it forwards HTTP requests to \u003ccode>dj-api\u003c/code> which then fires the appropriate event or notification.\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">┌──────────────┐  HTTP/JSON   ┌──────────────┐  Event/Notification    ┌──────────┐\n│  dj-nuxt     │ ──────────►  │  dj-api      │ ─────────────────────► │  SMTP /  │\n│  (Nuxt 3)    │              │  (Laravel)   │                        │  Mailgun │\n└──────────────┘              └──────────────┘                        └──────────┘\n                                                                              ▲\n┌──────────────┐  Event/Notification / Direct Mail                            │\n│  dj          │ ─────────────────────────────────────────────────────────────┘\n│  (Laravel)   │\n└──────────────┘\u003c/code>\u003c/pre>\u003ch3 id=\"audit-transport-layer\">Transport Layer\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Repo\u003c/th>\u003cth>Default Transport\u003c/th>\u003cth>Production Transport\u003c/th>\u003cth>Dev/Test Transport\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>MAIL_MAILER=smtp\u003c/code>\u003c/td>\u003ctd>SMTP via \u003ccode>smtp.mailgun.org\u003c/code> (TLS :587)\u003c/td>\u003ctd>Mailpit \u003ccode>:1025\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>MAIL_MAILER=smtp\u003c/code>\u003c/td>\u003ctd>SMTP via \u003ccode>smtp.mailgun.org\u003c/code> (TLS :587); \u003ccode>failover\u003c/code> fallback to \u003ccode>log\u003c/code>\u003c/td>\u003ctd>Mailpit \u003ccode>:1025\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Both repos also have a \u003cstrong>Mailgun HTTP driver\u003c/strong> (\u003ccode>'transport' =&gt; 'mailgun'\u003c/code>) configured in \u003ccode>config/mail.php\u003c/code> and Mailgun credentials (\u003ccode>MAILGUN_DOMAIN\u003c/code>, \u003ccode>MAILGUN_SECRET\u003c/code>) in \u003ccode>config/services.php\u003c/code>. The active transport is selected at runtime via \u003ccode>MAIL_MAILER\u003c/code> env variable.\u003c/p>\u003ch3 id=\"audit-dispatch-mechanism\">Dispatch Mechanism\u003c/h3>\u003cp>All emails are dispatched through one of three patterns:\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Pattern\u003c/th>\u003cth>Where Used\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Laravel Notifications\u003c/strong> (\u003ccode>$model-&gt;notify(new XyzNotification(...))\u003c/code>)\u003c/td>\u003ctd>Both \u003ccode>dj\u003c/code> and \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>Preferred pattern. Most implement \u003ccode>ShouldQueue\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Mailable Classes\u003c/strong> (\u003ccode>Mail::to(...)-&gt;send(new XyzMail(...))\u003c/code>)\u003c/td>\u003ctd>\u003ccode>dj\u003c/code> only\u003c/td>\u003ctd>Used for a handful of direct admin/B2B emails.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Anonymous Notification Route\u003c/strong> (\u003ccode>Notification::route('mail', $address)-&gt;notify(...)\u003c/code>)\u003c/td>\u003ctd>Both\u003c/td>\u003ctd>Used when recipient is not a database model (e.g., admin email addresses).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"audit-queue\">Queue\u003c/h3>\u003cul>\u003cli>\u003cstrong>Development\u003c/strong>: \u003ccode>QUEUE_CONNECTION=sync\u003c/code> — all notifications fire synchronously inline.\u003c/li>\u003cli>\u003cstrong>Production\u003c/strong>: queue driver (\u003ccode>redis\u003c/code> / \u003ccode>database\u003c/code>) expected; most notifications implement \u003ccode>ShouldQueue\u003c/code> and the \u003ccode>Queueable\u003c/code> trait, meaning they are dispatched to the queue worker asynchronously.\u003c/li>\u003cli>Many \u003ccode>dj\u003c/code> notifications also call \u003ccode>toDatabase()\u003c/code> / \u003ccode>toArray()\u003c/code> alongside \u003ccode>toMail()\u003c/code>, meaning they \u003cstrong>persist in the \u003ccode>notifications\u003c/code> table\u003c/strong> for in-app display as well as sending email.\u003c/li>\u003c/ul>\u003chr>\u003ch2 id=\"audit-2-repository-breakdown\">2. Repository Breakdown\u003c/h2>\u003ch3 id=\"audit-2-1-dj-dashboard-application\">2.1 \u003ccode>dj\u003c/code> — Dashboard Application\u003c/h3>\u003cp>\u003cstrong>Role:\u003c/strong> Admin/Employer-facing Laravel dashboard. Manages jobs, companies, billing, applicants.\u003c/p>\u003cp>\u003cstrong>Mail-related directories:\u003c/strong>\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">dj/app/\n├── Mail/                          # 6 Mailable classes\n│   ├── AppliedToJob.php\n│   ├── AskForCareerAdvice.php\n│   ├── CardPayment.php\n│   ├── JobReview.php\n│   ├── ShareLink.php\n│   └── SzmdRedact.php\n├── Notifications/                 # ~60 Notification classes\n├── Listeners/\n│   ├── Dashboard/                 # ~30 event listeners, many dispatch notifications\n│   ├── Frontend/                  # ~10 listeners for job-seeker-initiated events\n│   ├── Szmd/\n│   └── ...\n└── Providers/\n    └── EventServiceProvider.php   # ~45 event → listener mappings\u003c/code>\u003c/pre>\u003cp>\u003cstrong>Trigger mechanisms in \u003ccode>dj\u003c/code>:\u003c/strong>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mechanism\u003c/th>\u003cth>Files\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Event → Listener → Notification\u003c/strong>\u003c/td>\u003ctd>\u003ccode>EventServiceProvider.php\u003c/code>, \u003ccode>Listeners/\u003c/code>\u003c/td>\u003ctd>Primary pattern. Events fired in controllers/services, listeners dispatch notifications.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Direct controller \u003ccode>-&gt;notify()\u003c/code>\u003c/strong>\u003c/td>\u003ctd>\u003ccode>UserController\u003c/code>, \u003ccode>AuthController\u003c/code>, \u003ccode>GoldEmailController\u003c/code>, \u003ccode>CandidateShortlistController\u003c/code>, \u003ccode>EgghunterController\u003c/code>\u003c/td>\u003ctd>Ad-hoc triggers not fitting event model.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Direct \u003ccode>Mail::to()-&gt;send()\u003c/code>\u003c/strong>\u003c/td>\u003ctd>\u003ccode>ShareViaMailController\u003c/code>, \u003ccode>JobApplication\u003c/code> listener, \u003ccode>SzmdRenominationListener\u003c/code>, \u003ccode>SzmdWithdrawnListener\u003c/code>, \u003ccode>SzamlazzhuInvoiceCreatedEventListener\u003c/code>\u003c/td>\u003ctd>Mailable classes used for direct sends.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Scheduled Console Commands\u003c/strong>\u003c/td>\u003ctd>\u003ccode>Console/Kernel.php\u003c/code>\u003c/td>\u003ctd>~15 commands that fire notification events or dispatch emails on a schedule.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Regional override system:\u003c/strong> A \u003ccode>RegionClassResolver::resolve($baseClass)\u003c/code> utility selects between \u003ccode>dj/app/Notifications/XyzNotification.php\u003c/code> (HU default) and \u003ccode>dj/app/Overriders/RO/Notifications/XyzNotification.php\u003c/code> (RO market) at runtime based on the company/user's region. See \u003ca href=\"#5-appendix-regional-overriders\">Appendix 5\u003c/a>.\u003c/p>\u003chr>\u003ch3 id=\"audit-2-2-dj-api-backend-api\">2.2 \u003ccode>dj-api\u003c/code> — Backend API\u003c/h3>\u003cp>\u003cstrong>Role:\u003c/strong> REST API consumed by \u003ccode>dj-nuxt\u003c/code>. Handles job seeker flows: registration, applications, password reset, profile management.\u003c/p>\u003cp>\u003cstrong>Mail-related directories:\u003c/strong>\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">dj-api/app/\n├── Notifications/                 # 11 Notification classes\n│   ├── ApplicationB2bNotification.php\n│   ├── ApplicationB2cNotification.php\n│   ├── ApplicationB2cWithoutCompanyNotification.php\n│   ├── CandidateShortlistNotification.php\n│   ├── EmailValidationNotification.php\n│   ├── JobNotificationSubscribeNotification.php\n│   ├── OtpNotification.php\n│   ├── PasswordResetNotification.php\n│   ├── ProfileDeletionNotification.php\n│   ├── SbpProfileCreatedNotification.php\n│   └── WelcomeNotification.php\n├── Listeners/                     # 8 event listeners\n└── Providers/\n    └── EventServiceProvider.php   # 6 event → listener mappings\u003c/code>\u003c/pre>\u003cp>\u003cstrong>\u003ccode>dj-api\u003c/code> EventServiceProvider mappings:\u003c/strong>\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"php\">Registered::class =&gt; [\n    EmailVerificationListener::class,   // → EmailValidationNotification\n    WelcomeNotificationListener::class, // → WelcomeNotification\n],\nApplicationCreated::class =&gt; [\n    ApplicationB2CNotificationListener::class, // → ApplicationB2c[WithoutCompany]Notification\n    ApplicationB2BNotificationListener::class, // → ApplicationB2bNotification\n    ApplicationSubscribeToMiniCRMListener::class,\n],\nPasswordResetEvent::class =&gt; [\n    PasswordResetListener::class, // → PasswordResetNotification\n],\nProfileDeleted::class =&gt; [\n    SendProfileDeletionNotification::class, // → ProfileDeletionNotification\n],\nCVUploaded::class =&gt; [\n    SendCVToN8NListener::class, // Non-email: forwards CV to n8n workflow\n],\u003c/code>\u003c/pre>\u003cp>\u003cstrong>Email templates (Blade):\u003c/strong>\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">dj-api/resources/views/mail/\n├── application_b2b.blade.php\n├── application_b2c.blade.php\n├── application_b2c_without_company.blade.php\n├── candidate_shortlist.blade.php\n├── job-notification.blade.php\n├── otp.blade.php\n├── password-reset.blade.php\n├── profile_deleted.blade.php\n└── welcome.blade.php\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-2-3-dj-nuxt-frontend-application\">2.3 \u003ccode>dj-nuxt\u003c/code> — Frontend Application\u003c/h3>\u003cp>\u003cstrong>Role:\u003c/strong> Nuxt 3 SSR frontend for job seekers. Does \u003cstrong>not\u003c/strong> send email directly. All user actions that trigger emails flow through server-side API proxy routes to \u003ccode>dj-api\u003c/code>.\u003c/p>\u003cp>\u003cstrong>Server routes that initiate email-triggering API calls:\u003c/strong>\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">dj-nuxt/server/api/\n├── register.ts                    → POST /api/register      → dj-api fires Welcome + EmailValidation\n├── forgot-password.ts             → POST /api/forgot-password → dj-api fires PasswordReset\n├── reset-password.ts              → POST /api/reset-password  (no email, just sets password)\n├── otp-request.post.ts            → POST /api/otp-request   → dj-api fires OtpNotification\n├── remove-user.ts                 → DELETE /api/profile     → dj-api fires ProfileDeletion\n├── application.ts                 → POST /api/jobs/{slug}/application → dj-api fires B2C+B2B notifications\n├── application-without-auth.ts    → POST /api/jobs/{slug}/application (guest) → same\n├── csl-order.ts                   → POST /api/candidate-shortlist → dj-api fires CandidateShortlist\n└── minicrm-subscribe.ts           → (CRM only, no direct email)\u003c/code>\u003c/pre>\u003chr>\u003ch2 id=\"audit-3-master-email-matrix\">3. Master Email Matrix\u003c/h2>\u003cblockquote>\u003cp>\u003cstrong>Legend:\u003c/strong> ✅ Queued (async) | ⚡ Sync | 📅 Scheduled\u003c/p>\u003c/blockquote>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Trigger Event\u003c/th>\u003cth>Origin Repo\u003c/th>\u003cth>Handling Component / File\u003c/th>\u003cth>Recipient\u003c/th>\u003cth>Email Type\u003c/th>\u003cth>Template / Class\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>AUTHENTICATION &amp; ONBOARDING\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>User registers via Nuxt\u003c/td>\u003ctd>\u003ccode>dj-nuxt\u003c/code> → \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>WelcomeNotificationListener\u003c/code> → \u003ccode>WelcomeNotification\u003c/code>\u003c/td>\u003ctd>New user\u003c/td>\u003ctd>Transactional — Welcome\u003c/td>\u003ctd>\u003ccode>mail.welcome\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>User registers via Nuxt\u003c/td>\u003ctd>\u003ccode>dj-nuxt\u003c/code> → \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>EmailVerificationListener\u003c/code> → \u003ccode>EmailValidationNotification\u003c/code>\u003c/td>\u003ctd>New user\u003c/td>\u003ctd>Transactional — Email Verification\u003c/td>\u003ctd>\u003ccode>mail.email_validation\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>User requests password reset (Nuxt)\u003c/td>\u003ctd>\u003ccode>dj-nuxt\u003c/code> → \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>PasswordResetListener\u003c/code> → \u003ccode>PasswordResetNotification\u003c/code>\u003c/td>\u003ctd>User\u003c/td>\u003ctd>Transactional — Password Reset\u003c/td>\u003ctd>\u003ccode>mail/password-reset.blade.php\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>User requests OTP login (Nuxt)\u003c/td>\u003ctd>\u003ccode>dj-nuxt\u003c/code> → \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>OtpNotification\u003c/code> (direct controller)\u003c/td>\u003ctd>User\u003c/td>\u003ctd>Transactional — OTP Code\u003c/td>\u003ctd>\u003ccode>mail/otp.blade.php\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>User registers via dj (legacy/dashboard)\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>RegisteredEventListener\u003c/code> → \u003ccode>UserRegistered\u003c/code>\u003c/td>\u003ctd>New user\u003c/td>\u003ctd>Transactional — Welcome\u003c/td>\u003ctd>\u003ccode>mail.welcome\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Email validation re-send (dj)\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>UserController\u003c/code> → \u003ccode>EmailValidationNotification\u003c/code>\u003c/td>\u003ctd>User\u003c/td>\u003ctd>Transactional — Email Verification\u003c/td>\u003ctd>\u003ccode>mail.email_validation\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>New dashboard manager account created\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>CompanyManagerCreated\u003c/code> listener → \u003ccode>ActivateAddedAccountNotification\u003c/code>\u003c/td>\u003ctd>New manager\u003c/td>\u003ctd>Transactional — Account Activation\u003c/td>\u003ctd>\u003ccode>mail.activateaddedaccount\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Manager account activated by admin\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>ManagerActivated\u003c/code> listener → \u003ccode>ManagerActivatedNotification\u003c/code>\u003c/td>\u003ctd>Manager\u003c/td>\u003ctd>Transactional — Activation Confirmed\u003c/td>\u003ctd>\u003ccode>mail.manageractivated\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>Manager registered/invited to company\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>ManagerRegistered\u003c/code> listener → \u003ccode>ManagerWelcomeNotification\u003c/code>\u003c/td>\u003ctd>Manager\u003c/td>\u003ctd>Transactional — Manager Welcome\u003c/td>\u003ctd>\u003ccode>mail.managerwelcome\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>JOB APPLICATIONS\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Job application submitted (Nuxt, B2C)\u003c/td>\u003ctd>\u003ccode>dj-nuxt\u003c/code> → \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>ApplicationB2CNotificationListener\u003c/code> → \u003ccode>ApplicationB2cNotification\u003c/code>\u003c/td>\u003ctd>Applicant (job seeker)\u003c/td>\u003ctd>Transactional — Application Confirmation\u003c/td>\u003ctd>\u003ccode>mail/application_b2c.blade.php\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>Job application submitted (Nuxt, hidden company)\u003c/td>\u003ctd>\u003ccode>dj-nuxt\u003c/code> → \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>ApplicationB2CNotificationListener\u003c/code> → \u003ccode>ApplicationB2cWithoutCompanyNotification\u003c/code>\u003c/td>\u003ctd>Applicant\u003c/td>\u003ctd>Transactional — Application Confirmation (no company)\u003c/td>\u003ctd>\u003ccode>mail/application_b2c_without_company.blade.php\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>Job application submitted (Nuxt, B2B)\u003c/td>\u003ctd>\u003ccode>dj-nuxt\u003c/code> → \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>ApplicationB2BNotificationListener\u003c/code> → \u003ccode>ApplicationB2bNotification\u003c/code>\u003c/td>\u003ctd>Company (job owner)\u003c/td>\u003ctd>Transactional — New Application Alert\u003c/td>\u003ctd>\u003ccode>mail/application_b2b.blade.php\u003c/code> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>13\u003c/td>\u003ctd>Job application submitted (dj legacy)\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>Frontend\\JobApplication\u003c/code> listener → \u003ccode>AppliedToJob\u003c/code> Mail nternal template)\u003c/em>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>SHARING &amp; REFERRALS\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>59\u003c/td>\u003ctd>User shares a job/company via email\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>ShareViaMailController\u003c/code> → \u003ccode>Mail::to()-&gt;send(ShareLink)\u003c/code>\u003c/td>\u003ctd>Friend (any email)\u003c/td>\u003ctd>Engagement — Share\u003c/td>\u003ctd>\u003ccode>mail.link_share_{modelType}\u003c/code> ⚡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60\u003c/td>\u003ctd>Friend invitation (IT quiz test)\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>TestController\u003c/code> → \u003ccode>FriendInviteNotification\u003c/code>\u003c/td>\u003ctd>Friend\u003c/td>\u003ctd>Engagement — Invite\u003c/td>\u003ctd>\u003ccode>mail.tests_friend_invite\u003c/code> ⚡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>REVIEWS\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>61\u003c/td>\u003ctd>Job review submitted\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>ReviewCreated\u003c/code> event → \u003ccode>ReviewCreatedEventListener\u003c/code> → \u003ccode>ReviewCreatedNotification\u003c/code>\u003c/td>\u003ctd>Company\u003c/td>\u003ctd>Transactional — New Review\u003c/td>\u003ctd>\u003cem>(internal template)\u003c/em> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>62\u003c/td>\u003ctd>Admin triggers job review email\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>Admin\\JobReviewController\u003c/code> → \u003ccode>Notification::send()\u003c/code> → \u003ccode>ReviewCreatedNotification\u003c/code>\u003c/td>\u003ctd>Company managers\u003c/td>\u003ctd>Alert — Review Notification\u003c/td>\u003ctd>\u003cem>(internal template)\u003c/em> ⚡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>63\u003c/td>\u003ctd>Admin submits user review\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>Admin\\UserReviewController\u003c/code> → \u003ccode>UserReviewCreatedNotification\u003c/code>\u003c/td>\u003ctd>User\u003c/td>\u003ctd>Transactional — Review Received\u003c/td>\u003ctd>\u003cem>(internal template)\u003c/em> ⚡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ADMIN &amp; MISC\u003c/strong>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>64\u003c/td>\u003ctd>Gold profile interest submitted\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>GoldEmailController\u003c/code> → \u003ccode>GoldRequestNotification\u003c/code>\u003c/td>\u003ctd>Admin (business) + Requester\u003c/td>\u003ctd>Transactional — Gold Interest\u003c/td>\u003ctd>\u003ccode>mail.gold_request_to_admin\u003c/code> / \u003ccode>mail.gold_request_to_b2b\u003c/code> ⚡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>65\u003c/td>\u003ctd>Career advice request submitted\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>UserController\u003c/code> → \u003ccode>Mail::to()-&gt;send(AskForCareerAdvice)\u003c/code>\u003c/td>\u003ctd>Admin (marketing)\u003c/td>\u003ctd>Alert — Career Advice\u003c/td>\u003ctd>\u003ccode>mail.admin_asked_for_career_advice\u003c/code> ⚡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>66\u003c/td>\u003ctd>Candidate Shortlist service order (Nuxt)\u003c/td>\u003ctd>\u003ccode>dj-nuxt\u003c/code> → \u003ccode>dj-api\u003c/code>\u003c/td>\u003ctd>\u003ccode>CandidateShortlistController\u003c/code> → \u003ccode>CandidateShortlistNotification\u003c/code>\u003c/td>\u003ctd>Admin (business team)\u003c/td>\u003ctd>Alert — CSL Order\u003c/td>\u003ctd>\u003ccode>mail/candidate_shortlist.blade.php\u003c/code> ⚡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>67\u003c/td>\u003ctd>Candidate Shortlist service order (dj)\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>Api\\CandidateShortlistController\u003c/code> → \u003ccode>CandidateShortlistNotification\u003c/code>\u003c/td>\u003ctd>Admin (business)\u003c/td>\u003ctd>Alert — CSL Order\u003c/td>\u003ctd>\u003ccode>mail.candidate_shortlist\u003c/code> ⚡\u003c/td>\u003c/tr>\u003ctr>\u003ctd>68\u003c/td>\u003ctd>Egg hunt / Xmas promo\u003c/td>\u003ctd>\u003ccode>dj\u003c/code>\u003c/td>\u003ctd>\u003ccode>EgghunterController\u003c/code> → \u003ccode>EggHuntNotification\u003c/code>\u003c/td>\u003ctd>Users / Companies\u003c/td>\u003ctd>Marketing — Seasonal Promo\u003c/td>\u003ctd>\u003ccode>mail.egghunt\u003c/code> ⚡\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003chr>\u003ch2 id=\"audit-4-deep-dive-by-workflow\">4. Deep Dive by Workflow\u003c/h2>\u003ch3 id=\"audit-4-1-authentication-onboarding\">4.1 Authentication &amp; Onboarding\u003c/h3>\u003ch4 id=\"audit-4-1-1-user-registration-via-dj-nuxt\">4.1.1 User Registration (via \u003ccode>dj-nuxt\u003c/code>)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. User fills registration form in dj-nuxt\n2. dj-nuxt/server/api/register.ts  ─POST /register──►  dj-api\n3. dj-api AuthenticationController stores user, fires Registered event\n4. EventServiceProvider dispatches two listeners:\n   a. EmailVerificationListener  → $user-&gt;notify(new EmailValidationNotification)\n      → Blade: mail/email_validation, subject: &quot;mail.email-validation.subject&quot;\n   b. WelcomeNotificationListener → $user-&gt;notify(new WelcomeNotification)\n      → Blade: mail/welcome, subject: region_trans('mail.welcome.subject')\n5. Both notifications implement ShouldQueue → dispatched to queue worker\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-1-2-password-reset-via-dj-nuxt\">4.1.2 Password Reset (via \u003ccode>dj-nuxt\u003c/code>)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. User clicks &quot;Forgot Password&quot; in dj-nuxt\n2. dj-nuxt/server/api/forgot-password.ts  ─POST /forgot-password──►  dj-api\n3. dj-api fires PasswordResetEvent (with user model + token)\n4. PasswordResetListener::handle() → resolves region class:\n   - HU: PasswordResetNotification\n   - RO: Overriders\\RO\\Notifications\\PasswordResetNotification\n5. $user-&gt;notify(new PasswordResetNotification($user, $token))\n   → Blade: mail/password-reset.blade.php\n   → Subject: &quot;mail.password-reset.subject&quot;\n   → Contains a one-time reset URL with the token\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-1-3-otp-login-via-dj-nuxt\">4.1.3 OTP Login (via \u003ccode>dj-nuxt\u003c/code>)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. User requests OTP (passwordless login)\n2. dj-nuxt/server/api/otp-request.post.ts  ─POST /otp-request──►  dj-api\n3. dj-api controller creates OTP record, sends:\n   $user-&gt;notify(new OtpNotification($user, $locale))\n   → Blade: mail/otp.blade.php\n   → Subject: &quot;mail.otp.subject&quot;\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-1-4-manager-onboarding-via-dj-dashboard\">4.1.4 Manager Onboarding (via \u003ccode>dj\u003c/code> dashboard)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. Admin/company owner adds a new manager in the dashboard\n   → Event: CompanyManagerCreated (new account created) or CompanyManagerAdded (existing user)\n2a. CompanyManagerCreated → CompanyManagerCreated listener\n    → $manager-&gt;notify(new ActivateAddedAccountNotification)\n    → Template: mail.activateaddedaccount\n    → Also sends notification to RO admin: Notification::route('mail', config('mail.addresses.ro'))\n2b. CompanyManagerAdded → CompanyManagerAdded listener\n    → $manager-&gt;notify(new CompanyManagerAddedNotification)\n    → Template: mail.manager_added\n3. When manager activates their account:\n   Event: ManagerActivated → ManagerActivated listener\n   → $user-&gt;notify(new ManagerActivatedNotification)\n   → Template: mail.manageractivated\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-2-job-applications\">4.2 Job Applications\u003c/h3>\u003ch4 id=\"audit-4-2-1-standard-application-flow-via-dj-nuxt\">4.2.1 Standard Application Flow (via \u003ccode>dj-nuxt\u003c/code>)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. Job seeker submits application in dj-nuxt (with CV, optional cover letter)\n2. dj-nuxt/server/api/application.ts  ─POST /jobs/{slug}/application──►  dj-api\n3. dj-api ApplicationController stores the Application record, fires ApplicationCreated event\n4. EventServiceProvider dispatches:\n   a. ApplicationB2CNotificationListener:\n      - Checks if job has hide_company flag\n      - If hidden → $user-&gt;notify(new ApplicationB2cWithoutCompanyNotification)\n        Template: mail/application_b2c_without_company.blade.php\n      - Otherwise → $user-&gt;notify(new ApplicationB2cNotification)\n        Template: mail/application_b2c.blade.php\n      - Attaches CV and cover letter PDFs from storage/applications/\n      - Also stores notification in `notifications` table (via='database')\n   b. ApplicationB2BNotificationListener:\n      - Resolves RO override if needed\n      - $appRepository-&gt;notifyB2B(new ApplicationB2bNotification)\n        → Sends to company managers/HR inbox\n        Template: mail/application_b2b.blade.php\n        Also attaches CV/cover letter\n5. Both fire as queued jobs\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-2-2-application-rejection\">4.2.2 Application Rejection\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. Company manager clicks &quot;Reject&quot; on an applicant in dj dashboard\n2. dj Dashboard\\ApplicantController::notifyRejected()\n   → fires ApplicationRejected event\n3. ApplicationRejectedListener → resolves region class\n   → $user-&gt;notify(new ApplicationRejectedNotification)\n   Template: mail.application_rejected\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-3-job-plans-billing\">4.3 Job Plans &amp; Billing\u003c/h3>\u003ch4 id=\"audit-4-3-1-job-plan-lifecycle-emails\">4.3.1 Job Plan Lifecycle Emails\u003c/h4>\u003cp>The \u003ccode>ManageJobPlans\u003c/code> Artisan command runs on a schedule and checks plan statuses, firing the appropriate events.\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">Plan posted\n  └── JobPlanPendingCreated event\n        → JobPlanPendingCreatedNotification to Company\n                &quot;Your payment is pending&quot;\n\nBank transfer received / card payment success\n  └── JobPlanPendingSuccess event\n        → JobPlanPendingSuccessNotification to Company\n                &quot;Payment confirmed, your job is active&quot;\n\nPayment fails\n  └── JobPlanPendingFailed event\n        → JobPlanPendingFailedNotification to Company\n\nPlan active, nearing expiry (scheduled check)\n  └── JobPlanExpires event\n        → JobPlanExpiresNotification to Company\n                &quot;Your job plan expires in X days&quot;\n\nPlan expiry date passed (scheduled check)\n  └── JobPlanExpired event\n        → JobPlanExpiredNotification to Company\n        → JobClosedNotification to Company (job was auto-closed)\n\nSystem auto-closes job (no manual close)\n  └── JobPlanAutoClosed event\n        → JobPlanAutoClosedNotification to Company\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-3-2-invoice-flow-szamlazz-hu-integration\">4.3.2 Invoice Flow (Számlázz.hu Integration)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. Payment gateway (OTP SimplePay card / bank transfer) confirms payment\n2. dj calls Számlázz.hu API to issue invoice\n3. SzamlazzhuInvoiceCreated event fires\n4. SzamlazzhuInvoiceCreatedEventListener::handle():\n   a. Resolves InvoiceNotification (HU) or RO override\n   b. If company has invoice_email configured:\n        Notification::route('mail', $company-&gt;invoice_email)-&gt;notify(InvoiceNotification)\n      Else:\n        $company-&gt;notify(new InvoiceNotification)\n        → Template: mail.invoice (szamla) or mail.invoicerequest (dijbekero/proforma)\n   c. OfferAdminNotification to admin if invoice relates to a commercial offer\n   d. Mail::to($notify)-&gt;send(new CardPayment($invoice))\n        → Template: mail.admin_card_payment\n        → Recipients: finance admin + company's DreamJobs contact + RO contact\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-4-company-management\">4.4 Company Management\u003c/h3>\u003ch4 id=\"audit-4-4-1-company-registration\">4.4.1 Company Registration\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. Company submits registration in dj dashboard\n2. Event: Dashboard\\CompanyRegistered\n3. CompanyRegistered listener → $company-&gt;notify(new CompanyRegisteredNotification)\n   Template: mail.company-registered\n   Region-overridden for RO market\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-4-2-manager-invitation-removal\">4.4.2 Manager Invitation / Removal\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">Add manager (existing user):\n  CompanyManagerAdded event → CompanyManagerAdded listener\n  → manager-&gt;notify(new CompanyManagerAddedNotification)\n    + Notification::route(config('mail.addresses.ro'))-&gt;notify(...) [RO only]\n\nCreate manager (new account):\n  CompanyManagerCreated event → CompanyManagerCreated listener\n  → manager-&gt;notify(new ActivateAddedAccountNotification)\n\nRemove manager:\n  CompanyManagerRemoved event → CompanyManagerRemoved listener\n  → manager-&gt;notify(new CompanyManagerRemovedNotification)\n    Region-overridden for RO\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-4-3-job-closed-applicants-admin\">4.4.3 Job Closed – Applicants &amp; Admin\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">Manual close by admin or expiry:\n  JobClosed event → JobClosed listener:\n    → Admin contacts notified: JobClosedAdminNotification\n    → marketing email always notified\n\n  JobClosedToApplicants event → JobClosedToApplicants listener:\n    → Iterates job applications in chunks of 100\n    → Each applicant: $user-&gt;notify(new JobClosedToApplicantsNotification)\n      Template: mail.closed_job_mail_to_applicants\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-5-user-engagement-marketing\">4.5 User Engagement &amp; Marketing\u003c/h3>\u003ch4 id=\"audit-4-5-1-job-recommendations-scheduled\">4.5.1 Job Recommendations (Scheduled)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">Schedule: daily or weekly based on user subscription preference\nCommand: JobRecommendationNotifications\n  → Fetches users subscribed to job recommendations\n  → Fires JobRecommendationEvent per user (with matched job list)\n  → JobRecommendationListener → $user-&gt;notify(new JobRecommendationNotification)\n    Template: mail.recommended-jobs (daily) or mail.recommended-jobs-weekly\n    Region-overridden for RO\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-5-2-job-notification-subscription-nuxt-api\">4.5.2 Job Notification Subscription (Nuxt/API)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">User subscribes to job alerts without creating account:\n  dj-nuxt/server/api/minicrm-subscribe.ts → dj-api\n  OR dj-api AuthenticationController directly:\n  → Notification::route('mail', [$email =&gt; $name])-&gt;notify(\n        new JobNotificationSubscribeNotification($user, $password)\n    )\n    Template: mail/job-notification.blade.php\n    Note: also sends temporary password if new account was created\u003c/code>\u003c/pre>\u003ch4 id=\"audit-4-5-3-saved-job-reminder-scheduled\">4.5.3 Saved Job Reminder (Scheduled)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">Command: SavedJobReminder\n  → Fetches users with saved jobs that are about to close / meet criteria\n  → Fires SavedJobReminderEvent\n  → SavedJobReminderListener → $user-&gt;notify(new SavedJobReminderNotification)\n    Region-overridden for RO\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-6-devchallenge-dc-feature\">4.6 DevChallenge (DC) Feature\u003c/h3>\u003cp>The DevChallenge is a gamified coding contest feature. Emails are dispatched by scheduled Artisan commands in \u003ccode>dj\u003c/code>:\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>Notification\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>DcNewChallengeNewsletter\u003c/code>\u003c/td>\u003ctd>\u003ccode>DCNewChallengeNotification\u003c/code>\u003c/td>\u003ctd>Sent when a new challenge opens. \u003ccode>[DevChallenge]\u003c/code> subject prefix.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>DcActivityNewsletters\u003c/code>\u003c/td>\u003ctd>\u003ccode>DCUserActivationNotification\u003c/code>\u003c/td>\u003ctd>Activity / participation reminders for individual users.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>DcStreakNotification\u003c/code>\u003c/td>\u003ctd>\u003ccode>DCUserStreakNotification\u003c/code>\u003c/td>\u003ctd>Celebrates or reminds about active participation streaks.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>DcWeeklyResultsNewsletter\u003c/code>\u003c/td>\u003ctd>\u003ccode>DCWeeklyResultsNotification\u003c/code>\u003c/td>\u003ctd>Weekly recap of challenge results.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>All DC notifications use the \u003ccode>[DevChallenge]\u003c/code> subject prefix and target opted-in users only.\u003c/p>\u003chr>\u003ch3 id=\"audit-4-7-szmd-year-s-best-employer\">4.7 SZMD (Year's Best Employer)\u003c/h3>\u003cp>SZMD (&quot;Szuper Munkahely Díj&quot;) is an annual award for best employers.\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">Company nominates/re-nominates for SZMD:\n  SzmdRenominationEvent → SzmdRenominationListener\n  → Mail::to([config('mail.addresses.business')])-&gt;send(new SzmdRedact($company, true))\n    Template: mail.admin_szmd_redact\n    Subject: &quot;mail.szmd-renominate.subject&quot; (includes year config)\n\nCompany withdraws from SZMD:\n  SzmdWithdrawnEvent → SzmdWithdrawnListener\n  → Mail::to([$contactEmail])-&gt;send(new SzmdRedact($company, false))\n    Template: mail.admin_szmd_redact\n    Subject: &quot;mail.szmd-redact.subject&quot;\n    Recipient: company's DreamJobs contact email\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-8-smart-bench-profile-sbp\">4.8 Smart Bench Profile (SBP)\u003c/h3>\u003cp>SBP is a CV/profile feature for job seekers.\u003c/p>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">SBP profile created:\n  → SbpProfileCreatedNotification dispatched (from API service/controller)\n    Subject: &quot;mail.sbp_profile_created.subject&quot;\n\nSBP PDF report generation (scheduled):\n  Command: SendSbpPdfNotification\n  → SbpPdfNotification to user\n    PDF is a rendered CV template from dj-api/resources/views/cv_templates/\n\nSBP search free credit:\n  → SbpSearchFreeCreditNotification (ad-hoc, from service)\n\nSBP search lunch promo:\n  → SbpSearchLunchNotification (marketing campaign, manual trigger)\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-9-sharing-referrals\">4.9 Sharing &amp; Referrals\u003c/h3>\u003ch4 id=\"audit-share-link-via-email\">Share Link via Email\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">1. User clicks &quot;Share via email&quot; on a job or company page\n2. dj ShareViaMailController::send()\n   → Validates modelType (e.g., 'job', 'company')\n   → Mail::to($request-&gt;send_to)-&gt;send(new ShareLink($modelType, $model, $sentBy))\n     Template: mail.link_share_{modelType}  (e.g., mail.link_share_job)\n     Subject: &quot;mail.send-link-via-mail.subject&quot; with sender's name\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-10-reviews\">4.10 Reviews\u003c/h3>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">Job review submitted by job seeker:\n  ReviewCreated event → ReviewCreatedEventListener\n  → $company-&gt;notify(new ReviewCreatedNotification($review, $actor))\n    Notifies company managers about the new review\n\nAdmin manually sends review notification:\n  Admin\\JobReviewController::notify()\n  → Notification::send($users, new ReviewCreatedNotification($review))\n\nAdmin creates user review:\n  Admin\\UserReviewController\n  → $user-&gt;notify(new UserReviewCreatedNotification($user, $content))\u003c/code>\u003c/pre>\u003chr>\u003ch3 id=\"audit-4-11-admin-miscellaneous\">4.11 Admin &amp; Miscellaneous\u003c/h3>\u003ch4 id=\"audit-gold-profile-request\">Gold Profile Request\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">User submits interest in Gold Profile (premium service):\n  GoldEmailController::send()\n  → Notification::route('mail', config('mail.addresses.business'))\n        -&gt;notify(new GoldRequestNotification($request, 'admin'))\n    Template: mail.gold_request_to_admin\n    Subject: &quot;mail.gold-request-b2b.subject&quot;\n\n  → Notification::route('mail', $request-&gt;email)\n        -&gt;notify(new GoldRequestNotification($request, 'b2b'))\n    Template: mail.gold_request_to_b2b\n    Subject: &quot;GOLD Profil - Érdeklődés - {name}&quot;\u003c/code>\u003c/pre>\u003ch4 id=\"audit-career-advice-request\">Career Advice Request\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">User submits career advice form:\n  UserController::askForCareerAdvice()\n  → Mail::to(config('mail.addresses.marketing'))-&gt;send(\n        new AskForCareerAdvice($user, $name, $email, $files, $note)\n    )\n    Template: mail.admin_asked_for_career_advice\n    Subject: &quot;Karrier tanácsadás: {name}&quot;\n    Attaches any uploaded files\u003c/code>\u003c/pre>\u003ch4 id=\"audit-candidate-shortlist-csl-order\">Candidate Shortlist (CSL) Order\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">Via Nuxt:\n  dj-nuxt/server/api/csl-order.ts  ─POST /candidate-shortlist──►  dj-api\n  dj-api CandidateShortlistController\n  → Notification::route('mail', config('mail.addresses.business.{region}.address'))\n        -&gt;notify(new CandidateShortlistNotification($request))\n    Template: mail/candidate_shortlist.blade.php\n    Subject: &quot;{name} - Candidate Shortlist megrendelés&quot;\n\nVia dj dashboard:\n  dj Api\\CandidateShortlistController\n  → Same pattern, routed to config('mail.addresses.business')\u003c/code>\u003c/pre>\u003ch4 id=\"audit-used-pp-coupon-ppc-billing-alert\">Used PP Coupon (PPC Billing Alert)\u003c/h4>\u003cpre class=\"doc-code\">\u003ccode data-language=\"\">When a company uses a pay-per-click coupon:\n  UsedPPCouponEvent → UsedPPCouponListener\n  1. $company-&gt;notify(new UsedPPCouponNotification(...))       ← to company\n  2. foreach $notify as $email:\n       Notification::route('mail', $email)                     ← to DJ contacts\n           -&gt;notify(new UsedPPCouponNotification(..., isAdmin=true))\n  3. RO region: Notification::route('mail', config('mail.addresses.ro-marketing'))\n                    -&gt;notify(...) [marketing@dreamjobs.ro]\n  Region-overridden for RO\u003c/code>\u003c/pre>\u003chr>\u003ch2 id=\"audit-5-appendix-regional-overriders\">5. Appendix: Regional Overriders\u003c/h2>\u003cp>Both \u003ccode>dj\u003c/code> and \u003ccode>dj-api\u003c/code> implement a \u003cstrong>regional class override system\u003c/strong>. A \u003ccode>RegionClassResolver::resolve($baseClass)\u003c/code> utility returns the class name to instantiate based on the current region (HU vs RO).\u003c/p>\u003ch3 id=\"audit-dj-overriders-dj-app-overriders-ro\">\u003ccode>dj\u003c/code> Overriders (\u003ccode>dj/app/Overriders/RO/\u003c/code>)\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Base Class\u003c/th>\u003cth>RO Override\u003c/th>\u003cth>Key Differences\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>Notifications\\ApplicationRejectedNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO-specific template/subject\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\CompanyManagerRemovedNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO-specific template\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\InvoiceNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO VAT/fiscal rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\JobClosedNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO language\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\JobClosedToApplicantsNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO language\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\JobPlanExpiredNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO language\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\JobRecommendationNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO-specific logic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\ManagerWelcomeNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO onboarding content\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\NewCompanyAdminNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO admin routing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\SavedJobReminderNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO language\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\UsedPPCouponNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO billing/contacts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Mail\\CardPayment\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003ctd>RO invoice format\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3 id=\"audit-dj-api-overriders-dj-api-app-overriders-ro\">\u003ccode>dj-api\u003c/code> Overriders (\u003ccode>dj-api/app/Overriders/RO/\u003c/code>)\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Base Class\u003c/th>\u003cth>RO Override\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>Notifications\\ApplicationB2cWithoutCompanyNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\PasswordResetNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Notifications\\WelcomeNotification\u003c/code>\u003c/td>\u003ctd>✅\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003chr>\u003ch2 id=\"audit-6-appendix-scheduled-commands-summary\">6. Appendix: Scheduled Commands Summary\u003c/h2>\u003cp>The following commands in \u003ccode>dj/app/Console/Kernel.php\u003c/code> are responsible for time-based email dispatch. Exact schedules (\u003ccode>-&gt;daily()\u003c/code>, \u003ccode>-&gt;weekly()\u003c/code>, etc.) are defined in the \u003ccode>schedule()\u003c/code> method of the Kernel.\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Command Class\u003c/th>\u003cth>Notification Dispatched\u003c/th>\u003cth>Audience\u003c/th>\u003cth>Frequency\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ManageJobPlans\u003c/code>\u003c/td>\u003ctd>\u003ccode>JobPlanExpires\u003c/code>, \u003ccode>JobPlanExpired\u003c/code>, \u003ccode>JobPlanAutoClosed\u003c/code> events\u003c/td>\u003ctd>Companies\u003c/td>\u003ctd>Daily\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SendJobPlanUpgradeEmail\u003c/code>\u003c/td>\u003ctd>\u003ccode>JobPlanUpgrade\u003c/code>\u003c/td>\u003ctd>Companies with qualifying plans\u003c/td>\u003ctd>Periodic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SendAppliedToJobSurveyEmail\u003c/code>\u003c/td>\u003ctd>\u003ccode>AppliedToJobSurveyNotification\u003c/code>\u003c/td>\u003ctd>Applicants (N days after apply)\u003c/td>\u003ctd>Daily\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Send
