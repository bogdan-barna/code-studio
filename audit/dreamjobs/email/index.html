ion\u003c/code>\u003c/td>\u003ctd>\u003ccode>DCUserStreakNotification\u003c/code>\u003c/td>\u003ctd>DC users\u003c/td>\u003ctd>Periodic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>DcWeeklyResultsNewsletter\u003c/code>\u003c/td>\u003ctd>\u003ccode>DCWeeklyResultsNotification\u003c/code>\u003c/td>\u003ctd>DC subscribers\u003c/td>\u003ctd>Weekly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SendB2BNotification\u003c/code>\u003c/td>\u003ctd>\u003ccode>B2BNotification\u003c/code>\u003c/td>\u003ctd>B2B contact list\u003c/td>\u003ctd>Periodic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SendLovableWorkplacesVotingNotification\u003c/code>\u003c/td>\u003ctd>\u003ccode>LovableWorkplacesVotingNotification\u003c/code>\u003c/td>\u003ctd>Users\u003c/td>\u003ctd>Campaign-based\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003chr>\u003cp>\u003cem>Document generated via automated codebase audit. Last updated: 2026-05-26.\u003c/em>\u003c/p>","toc":[{"level":1,"title":"Email Notification Ecosystem Audit","id":"audit-email-notification-ecosystem-audit"},{"level":2,"title":"Table of Contents","id":"audit-table-of-contents"},{"level":2,"title":"1. Executive Summary","id":"audit-1-executive-summary"},{"level":3,"title":"Architecture","id":"audit-architecture"},{"level":3,"title":"Transport Layer","id":"audit-transport-layer"},{"level":3,"title":"Dispatch Mechanism","id":"audit-dispatch-mechanism"},{"level":3,"title":"Queue","id":"audit-queue"},{"level":2,"title":"2. Repository Breakdown","id":"audit-2-repository-breakdown"},{"level":3,"title":"2.1 `dj` — Dashboard Application","id":"audit-2-1-dj-dashboard-application"},{"level":3,"title":"2.2 `dj-api` — Backend API","id":"audit-2-2-dj-api-backend-api"},{"level":3,"title":"2.3 `dj-nuxt` — Frontend Application","id":"audit-2-3-dj-nuxt-frontend-application"},{"level":2,"title":"3. Master Email Matrix","id":"audit-3-master-email-matrix"},{"level":2,"title":"4. Deep Dive by Workflow","id":"audit-4-deep-dive-by-workflow"},{"level":3,"title":"4.1 Authentication & Onboarding","id":"audit-4-1-authentication-onboarding"},{"level":3,"title":"4.2 Job Applications","id":"audit-4-2-job-applications"},{"level":3,"title":"4.3 Job Plans & Billing","id":"audit-4-3-job-plans-billing"},{"level":3,"title":"4.4 Company Management","id":"audit-4-4-company-management"},{"level":3,"title":"4.5 User Engagement & Marketing","id":"audit-4-5-user-engagement-marketing"},{"level":3,"title":"4.6 DevChallenge (DC) Feature","id":"audit-4-6-devchallenge-dc-feature"},{"level":3,"title":"4.7 SZMD (Year's Best Employer)","id":"audit-4-7-szmd-year-s-best-employer"},{"level":3,"title":"4.8 Smart Bench Profile (SBP)","id":"audit-4-8-smart-bench-profile-sbp"},{"level":3,"title":"4.9 Sharing & Referrals","id":"audit-4-9-sharing-referrals"},{"level":3,"title":"4.10 Reviews","id":"audit-4-10-reviews"},{"level":3,"title":"4.11 Admin & Miscellaneous","id":"audit-4-11-admin-miscellaneous"},{"level":2,"title":"5. Appendix: Regional Overriders","id":"audit-5-appendix-regional-overriders"},{"level":3,"title":"`dj` Overriders (`dj/app/Overriders/RO/`)","id":"audit-dj-overriders-dj-app-overriders-ro"},{"level":3,"title":"`dj-api` Overriders (`dj-api/app/Overriders/RO/`)","id":"audit-dj-api-overriders-dj-api-app-overriders-ro"},{"level":2,"title":"6. Appendix: Scheduled Commands Summary","id":"audit-6-appendix-scheduled-commands-summary"}]},"hu":{"label":"Magyar emailek","html":"\u003ch1 id=\"hu-email-szovegek-magyar-hu\">Email Szövegek — Magyar (HU)\u003c/h1>\u003cblockquote>\u003cp>\u003cstrong>Platform:\u003c/strong> DreamJobs HU\u003c/p>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/resources/lang/hu/mail.php\u003c/code> + \u003ccode>dj-api/lang/hu/mail.php\u003c/code>\u003c/p>\u003cp>\u003cstrong>Utolsó frissítés:\u003c/strong> 2026-05-26\u003c/p>\u003cp>\u003cstrong>Megjegyzés:\u003c/strong> A \u003ccode>:placeholder\u003c/code> jelölések dinamikus adatok (pl. \u003ccode>:name\u003c/code>, \u003ccode>:company\u003c/code>, \u003ccode>:job\u003c/code>).\u003c/p>\u003cp>A HTML tagek az eredeti forráskódból származnak — az emailek HTML formátumban kerülnek kiküldésre.\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"hu-tartalomjegyzek\">Tartalomjegyzék\u003c/h2>\u003col>\u003cli>\u003ca href=\"#1-regisztráció-és-hitelesítés\">Regisztráció és Hitelesítés\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#2-állásjelentkezések\">Állásjelentkezések\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#3-állástervek-és-számlázás\">Állástervek és Számlázás\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#4-cégkezelés\">Cégkezelés\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#5-felhasználói-engagement-és-marketing\">Felhasználói Engagement és Marketing\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#6-devchallenge\">DevChallenge\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#7-szmd--szerethető-munkahelyek-díj\">SZMD — Szerethető Munkahelyek Díj\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#8-smart-bench-profile-sbp\">Smart Bench Profile (SBP)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#9-megosztás-és-meghívók\">Megosztás és Meghívók\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#10-értékelések\">Értékelések\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#11-adminisztráció-és-egyéb\">Adminisztráció és Egyéb\u003c/a>\u003c/li>\u003c/ol>\u003chr>\u003ch2 id=\"hu-1-regisztracio-es-hitelesites\">1. Regisztráció és Hitelesítés\u003c/h2>\u003ch3 id=\"hu-1-1-udvozlo-email-dj-dashboard-felhasznalo\">1.1 Üdvözlő email (dj — dashboard felhasználó)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.welcome\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a jófej álláskeresők közt, mi a DreamJo.bs-nál nagyon örülünk, hogy csatlakoztál!\u003c/p>\u003cp>Reméljük, hamar megtalálod, amit keresel, legyen az rugalmas munkaidő, kutyabarát office, vagy egyszerűen csak magasabb fizetés.\u003c/p>\u003cp>Mutatjuk, hol találod az ország legszerethetőbb állásait:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Aláírás:\u003c/strong> Nagyon szurkolunk, eredményes álláskeresést!\u003c/p>\u003chr>\u003ch3 id=\"hu-1-2-udvozlo-email-dj-api-job-seeker-regisztracio\">1.2 Üdvözlő email (dj-api — job seeker regisztráció)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a DreamJobs-nál, örülünk, hogy itt vagy!\u003c/p>\u003cp>Bízunk benne, hogy hamarosan rátalálsz új álommunkahelyedre - jelentsen ez rugalmas munkaidőt, összetartó csapatot vagy épp szintlépést a karrieredben.\u003c/p>\u003cp>Nézz be a cégek kulisszái mögé, és válassz a hozzád illő pozíciók közül:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Self-Branding promo blokk:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szeretnénk hatékonyan támogatni az álláskeresésben, ezért készítettük el egyedi álláskeresői megoldásunkat. Self-Branding profiljainkkal kitűnhetsz a többi jelölt közül, és kiemelheted a jelentkezésed - mutasd be kreatív eszköztárunk segítségével, hogy miben vagy erős, mitől vagy különleges!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Megnézem az állásokat | Elkészítem a Self-Branding profilom  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést kívánunk a Csapatunk nevében!  \u003cbr>\u003cstrong>Segítség:\u003c/strong> Ha bármiben segíthetünk, nyugodtan keress minket a hello@dreamjobs.hu címen.\u003c/p>\u003chr>\u003ch3 id=\"hu-1-3-udvozlo-email-dj-api-ro-piac-magyar-nyelvu-valtozat\">1.3 Üdvözlő email (dj-api — RO piac, magyar nyelvű változat)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/ro-mail.php\u003c/code> → \u003ccode>welcome\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs Romania oldalon!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a jófej álláskeresők közt, mi a DreamJobs-nál nagyon örülünk, hogy csatlakoztál!\u003c/p>\u003cp>Reméljük, hamar megtalálod, amit keresel, legyen az rugalmas munkaidő, kutyabarát office, vagy egyszerűen csak magasabb fizetés.\u003c/p>\u003cp>Mutatjuk, hol találod az ország legszerethetőbb állásait:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Segítség:\u003c/strong> business@dreamjobs.ro  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Nagyon szurkolunk, eredményes álláskeresést!\u003c/p>\u003chr>\u003ch3 id=\"hu-1-4-email-cim-megerositese\">1.4 Email cím megerősítése\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code> | \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>email-validation\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.email_validation\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Igazold vissza az e-mail címed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeres regisztráció! Egy teendőd van még, kérünk erősítsd meg email címed az alábbi linkre kattintva:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-1-5-jelszo-visszaallitas-keres-dj-dashboard\">1.5 Jelszó-visszaállítás kérés (dj — dashboard)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>password-reset.request\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.passwordresetrequest\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Elfelejtett jelszó\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Cím\u003c/strong>\u003c/td>\u003ctd>Új jelszó megadása\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Úgy tűnik, elfelejtetted a DreamJo.bs profilodhoz tartozó jelszavad.\u003c/p>\u003cp>Sebaj, adj meg új jelszót itt:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-1-6-jelszo-megvaltoztatva-dj-dashboard\">1.6 Jelszó megváltoztatva (dj — dashboard)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>password-reset.success\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Megváltozott a jelszavad\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Sikeresen megváltoztattad a jelszavad a DreamJo.bs profilodhoz.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-1-7-jelszo-visszaallitas-dj-api-job-seeker\">1.7 Jelszó-visszaállítás (dj-api — job seeker)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>password-reset\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/password-reset.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Jelszó visszaállítása\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ezt az e-mailt azért küldük, mert jelszó-visszaállítási kérelmet kezdeményeztél.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Jelszó visszaállítása  \u003cbr>\u003cstrong>Tájékoztató:\u003c/strong> Ha nem te kérted a jelszó visszaállítását, akkor nincs további teendőd.  \u003cbr>\u003cstrong>Figyelmeztetés:\u003c/strong> Ez a jelszó-visszaállító link :count perc múlva lejár.\u003c/p>\u003chr>\u003ch3 id=\"hu-1-8-otp-egyszeri-bejelentkezesi-kod\">1.8 OTP (Egyszeri bejelentkezési kód)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>otp\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/otp.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Bejelentkezési kód\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Az alábbi 6 számjegyű kód segítségével tudsz bejelentkezni a fiókodba:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Figyelmeztetés:\u003c/strong> Ez a kód :count percig érvényes.  \u003cbr>\u003cstrong>Tájékoztató:\u003c/strong> Ha nem te kérted ezt a kódot, kérjük, hagyd figyelmen kívül ezt az üzenetet.\u003c/p>\u003chr>\u003ch3 id=\"hu-1-9-allasertesito-feliratkozas-megerositese\">1.9 Állásértesítő feliratkozás megerősítése\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>job-notification\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/job-notification.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Feliratkoztál a DreamJobs állásértesítőjére\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Kedves :name!\u003c/p>\u003cp>Sikeresen feliratkoztál az állásértesítő hírlevelünkre, így egy lépéssel közelebb kerültél, hogy rátalálj új munkahelyedre.\u003c/p>\u003cp>Mostantól a megadott érdeklődési körök alapján személyre szabott állásértesítőket küldünk neked, hogy minél gyorsabban rátalálj a következő nagy lehetőségre – legyen az rugalmas munkaidő, inspiráló munkakörnyezet, kutyabarát iroda vagy épp vonzóbb juttatási csomag.\u003c/p>\u003cp>A belépéshez szükséges ideiglenes jelszavad: \u003cstrong>:pw\u003c/strong>\u003c/p>\u003cp>Ha úgy érzed, túl sok értesítést kapsz, a levelek alján található Leiratkozás gombra kattintva, vagy IDE KATTINTVA könnyedén módosíthatod a beállításaidat.\u003c/p>\u003cp>Kérdés esetén írj bátran a :address címre.\u003c/p>\u003cp>Sikeres álláskeresést kívánunk!\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"hu-2-allasjelentkezesek\">2. Állásjelentkezések\u003c/h2>\u003ch3 id=\"hu-2-1-sikeres-allasjelentkezes-b2c-jelolt-visszaigazolo-dj\">2.1 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>applied-to-job\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.applied_to_job\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Sikeres állásjelentkezés: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeresen jelentkeztél a \u003cstrong>:job\u003c/strong> pozícióra a \u003cstrong>:company\u003c/strong> céghez a DreamJobs álláspotálon.\u003c/p>\u003cp>A cég a jelentkezésed fogadta, türelmedet kérjük! Ha kérdésed lenne, írj nekünk: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megosztott adatok blokkja:\u003c/strong> A következő adataidat osztottuk meg velük, hogy felvehessék veled a kapcsolatot.\u003c/p>\u003cp>\u003cstrong>SBP promo:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Tudtad, hogy már Self-branding profillal is jelentkezhetsz az állásokra nálunk? Átlagosan 10 jelentkezésből csak 2 interjú jöhet össze. Növeld az esélyed a kiválasztás során, töltsd ki és jelentkezz könnyedén legközelebb azzal!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-k:\u003c/strong>  \u003c/p>\u003cul>\u003cli>Nézz szét azon között a cégek között, akiknél a toborzás nem állt meg!  \u003c/li>\u003cli>Jelentkezz a többi, hasonló állásunkra is!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést!\u003c/p>\u003chr>\u003ch3 id=\"hu-2-2-sikeres-allasjelentkezes-b2c-jelolt-visszaigazolo-dj-api\">2.2 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj-api)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>application-b2c\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/application_b2c.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Sikeres állásjelentkezés: :company @ :job\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (cég nélkül)\u003c/strong>\u003c/td>\u003ctd>Sikeres állásjelentkezés: :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (standard):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeresen jelentkeztél a \u003cstrong>:job\u003c/strong> pozícióra a \u003cstrong>:company\u003c/strong> céghez a DreamJo.bs állásportálon.\u003c/p>\u003cp>A cég a jelentkezésed fogadta, türelmedet kérjük! Ha kérdésed lenne, írj nekünk: :email\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet (cég nélkül — hide_company):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gratulálunk, sikeresen jelentkeztél a \u003cstrong>:job\u003c/strong> pozícióra a DreamJo.bs állásportálon.\u003c/p>\u003cp>A cég a jelentkezésed fogadta, türelmedet kérjük!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Jelszó ajánló (új felhasználónak):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Csak egy jelszót kell megadnod és kész is a DreamJobs regisztrációd. Ezt követően könnyedén tudsz állásokra jelentkezni és bármikor megtekintheted korábbi jelentkezéseid.\u003c/p>\u003cp>Jelszó megadásához és DreamJobs regisztrációd befejezéséhez használd az alábbi linket: link\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>SBP promo:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>Tudtad, hogy már Self-branding profillal is jelentkezhetsz az állásokra nálunk? Átlagosan 10 jelentkezésből csak 2 interjú jöhet össze. Növeld az esélyed a kiválasztás során, töltsd ki és jelentkezz könnyedén legközelebb azzal!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-k:\u003c/strong> Nézz szét azon között a cégek között, akiknél a toborzás nem állt meg! | Jelentkezz a többi, hasonló állásunkra is!  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést!\u003c/p>\u003chr>\u003ch3 id=\"hu-2-3-uj-jelentkezo-ertesito-b2b-cegnek-dj-api\">2.3 Új jelentkező értesítő (B2B — cégnek, dj-api)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>application-b2b\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/application_b2b.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Új jelentkező\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Remek hírünk van, \u003cstrong>:name\u003c/strong> jelentkezett a \u003cstrong>:job\u003c/strong> @ \u003cstrong>:company\u003c/strong> pozíciódra!!\u003c/p>\u003cp>Nézd meg \u003cstrong>:name\u003c/strong> jelentkezési adatait és CV-jét!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Állás jelentkezői  \u003cbr>\u003cstrong>PS:\u003c/strong> Kérünk, hogy mindenképp jelezz vissza neki, akkor is, ha nem releváns az állásra! Ez nemcsak neki fontos, a cégednek is - a jó munkáltatói márka része a visszajelzés.  \u003cbr>\u003cstrong>GDPR megjegyzés:\u003c/strong> Kérünk hogy a levélben kapott jelentkező adatokat bizalmasan, a hatályos adatvédelmi előírásoknak (GDPR) megfelelően kezeld.\u003c/p>\u003chr>\u003ch3 id=\"hu-2-4-visszautasitott-palyazat-ertesito\">2.4 Visszautasított pályázat értesítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>application-rejected\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.application_rejected\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Álláspályázat eredménye: :company @ :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Sajnálattal értesítünk, hogy a(z) \u003cstrong>:job\u003c/strong> pozícióra a(z) \u003cstrong>:company\u003c/strong> cégnél benyújtott jelentkezésed nem került kiválasztásra.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Bátorítás:\u003c/strong> Ne add fel! További izgalmas állásajánlataink várnak rád, amelyek talán még jobban illeszkednek a képességeidhez és karriercéljaidhoz.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Megnézem az állásokat  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sok sikert az álláskereséshez!\u003c/p>\u003chr>\u003ch3 id=\"hu-2-5-allasjelentkezes-utani-kerdoiv\">2.5 Állásjelentkezés utáni kérdőív\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>applied-to-job-survey\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.applied_to_job_survey\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Kíváncsian várjuk a véleményed az állásjelentkezésről! :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy az oldalunkon keresztül jelentkeztél egy állásra!\u003c/p>\u003cp>Kíváncsian várjuk a véleményed, kérjük töltsd ki ezt a rövid kérdőívet, segítsd a munkánkat!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Kitöltöm\u003c/p>\u003chr>\u003ch3 id=\"hu-2-6-befejezetlen-allasjelentkezes-emlekezteto\">2.6 Befejezetlen állásjelentkezés emlékeztető\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>unfinished-job-application\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Folytasd a jelentkezést\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Kedves :name!\u003c/p>\u003cp>Korábban félbehagytad az állásra jelentkezésed. Ne felejtsd el elküldeni mielőtt lejárna az állás.\u003c/p>\u003cp>:job_name\u003c/p>\u003cp>[LINK]\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"hu-3-allastervek-es-szamlazas\">3. Állástervek és Számlázás\u003c/h2>\u003ch3 id=\"hu-3-1-allas-megjelent-pending-fizetes-utan\">3.1 Állás megjelent (pending fizetés után)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>plan-pending-created\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Álláshirdetés publikálva\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Az álláshirdetésedet publikáltuk a kiválasztott csomagban. A végszámlát a kártya sikeres terhelése után, várhatóan 1 napon belül elküldjük emailben.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-3-2-kartyas-fizetes-sikeres\">3.2 Kártyás fizetés sikeres\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>plan-pending-success\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Sikeres bankártyás fizetés\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A kártyás fizetés sikeres volt. Mellékelve küldjük a számlád.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-3-3-kartyas-fizetes-visszautasitva\">3.3 Kártyás fizetés visszautasítva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>plan-pending-failed\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Visszautasított kártyás fizetés\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A bankkártya terhelése sikertelen volt, a szolgáltató elutasította a kártyás fizetést. A hirdetésedet koffeinmentes csomagba tettük át.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-3-4-hirdetesi-csomag-hamarosan-lejar\">3.4 Hirdetési csomag hamarosan lejár\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>job-expires\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Egy hét múlva lejár a hirdetési csomagod\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>1 hét múlva lejár a következő álláshoz tartozó csomagod: \u003cstrong>:job @ :company\u003c/strong>.\u003c/p>\u003cp>Az állás most a \u003cstrong>:plan\u003c/strong> csomagban fut egészen \u003cstrong>:date\u003c/strong>-ig.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Nézd meg a jelentkezőket, és jelezz vissza nekik!\u003c/p>\u003chr>\u003ch3 id=\"hu-3-5-hirdetesi-csomag-lejart\">3.5 Hirdetési csomag lejárt\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>job-expired\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Lejárt a hirdetési csomagod\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Lejárt a \u003cstrong>:plan\u003c/strong> csomagod a következő állásra: \u003cstrong>:job @ :company\u003c/strong>.\u003c/p>\u003cp>Az állásodat automatikusan lezárjuk. A jelentkezéseket mindig meg tudod majd tekinteni. A lezárt állást bármikor újra publikálhatod.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA-k:\u003c/strong>  \u003c/p>\u003cul>\u003cli>Ha továbbra is keresed az álommunkatársad, válassz új csomagot az álláshoz!  \u003c/li>\u003cli>Ha megtaláltad az embered, zárd le az állást!\u003c/li>\u003c/ul>\u003chr>\u003ch3 id=\"hu-3-6-allas-automatikusan-lezarva\">3.6 Állás automatikusan lezárva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>job-autoclose\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Lezártuk az állásod\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Két héttel ezelőtt lejárt a \u003cstrong>:plan\u003c/strong> csomagod a következő állásra \u003cstrong>:job @ :company\u003c/strong>.\u003c/p>\u003cp>Ezután az állásod még 2 hétig látszott a DreamJo.bs oldalán, de ma automatikusan lezártuk az állásod.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Ha szeretnéd tovább hirdetni az állást, kattintsd ide:\u003c/p>\u003chr>\u003ch3 id=\"hu-3-7-allas-lezarva-b2b-ertesito\">3.7 Állás lezárva (B2B értesítő)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>closedjob\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Lezárt hirdetés\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Hello, :jobname állásod lezárult.\u003c/p>\u003cp>Értesítsd ki a jelentkezőidet a toborzás jelenlegi állásáról automatikus üzenettel a Lezárt állás kezelése oldalon.\u003c/p>\u003cp>Kérjük adj nekünk visszajelzést, hogy sikerült-e megtalálnod a megfelelő jelöltet!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-3-8-allas-lezarva-jelentkezok-ertesitese\">3.8 Állás lezárva — jelentkezők értesítése\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>closed-job-page.mail-text\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>\u003cem>(tárgy a sablonban van meghatározva)\u003c/em>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Kedves Jelentkező!\u003c/p>\u003cp>Korábban jelentkeztél a(z) \u003cstrong>:job @ :company\u003c/strong> állásra.\u003c/p>\u003cp>Az álláshirdetés lezárult. Amennyiben alkalmasnak találnak a pozícióra, hamarosan felveszik veled a kapcsolatot.\u003c/p>\u003cp>Addig is nézz szét aktuális állásajánlataink között! »\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-3-9-hirdetesi-csomag-upgrade-ajanlat\">3.9 Hirdetési csomag upgrade ajánlat\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>job-plan-upgrade\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Időszaki DreamJo.bs Job Riport :job - Upgrade opció\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Tájékoztatunk, hogy ez a típusú és szenioritású állást \u003cstrong>ajánlásunk szerint az alábbi csomagban érdemes hirdetni:\u003c/strong> :plans\u003c/p>\u003cp>További információk a hirdetési csomagok kapcsán: ÁRLISTA\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Lehetőségek:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>UPGRADE:\u003c/strong> Vásárolj nagyobb hirdetést! Állítsd le \u003cstrong>7 napon belül\u003c/strong>, duplikáld, indítsd újra a nagyobb csomagban jelenlegi hirdetésed! Leállított hirdetésed értékét kedvezmény kupon formájában kapod vissza.\u003c/p>\u003cp>\u003cstrong>LEJÁRAT UTÁNI ÚJRA HIRDETÉS:\u003c/strong> Vásárolj nagyobb hirdetést \u003cstrong>még MA\u003c/strong>, használd fel 6 hónapon belül!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Csomagok ajánlás:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>- \u003cstrong>Espresso:\u003c/strong> 3.500 - 5.000 reach (Pályakezdő, általános Junior állásokhoz)\u003c/p>\u003cp>- \u003cstrong>Latte:\u003c/strong> 20.000 - 30.000 reach (Junior IT, Medior szintű egyéb állásokhoz)\u003c/p>\u003cp>- \u003cstrong>Cappuccino:\u003c/strong> 50.000 - 70.000 reach (Medior és Senior IT állások, egyéb Senior állásokhoz)\u003c/p>\u003cp>- \u003cstrong>Cappuccino Extra:\u003c/strong> 100.000 - 140.000 reach (nehéz IT pozíciókhoz, folyamatos kereséshez)\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> ÚJ HIRDETÉS VÁSÁRLÁS KEDVEZMÉNNYEL  \u003cbr>\u003cstrong>Köszönet:\u003c/strong> Köszönjük, hogy a DreamJo.bs-on hirdetsz!\u003c/p>\u003chr>\u003ch3 id=\"hu-3-10-uj-szamla\">3.10 Új számla\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>new-invoice\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Új számla\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Új számlád érkezett.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megjegyzés:\u003c/strong> A számlát a levél csatolmányaként is megtalálod.  \u003cbr>\u003cstrong>CTA:\u003c/strong> A számláidat itt tudod megnézni — Cég számlái\u003c/p>\u003chr>\u003ch3 id=\"hu-3-11-uj-dijbekero-proforma-szamla\">3.11 Új díjbekérő (proforma számla)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>new-proforma-invoice\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Új díjbekérő\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Új díjbekérőd érkezett. Fizesd be minél hamarabb, hogy elkezdhessük megkeresni a tökéletes új munkatársatokat!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megjegyzés:\u003c/strong> A díjbekérőt a levél csatolmányaként is megtalálod.\u003c/p>\u003chr>\u003ch3 id=\"hu-3-12-dijbekero-hamarosan-lejar\">3.12 Díjbekérő hamarosan lejár\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>payment-expires\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Hamarosan lejár a díjbekérőd\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Vigyázz, mert 3 nap múlva lejár az egyik díjbekérőd fizetési határideje.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megjegyzés:\u003c/strong> A díjbekérőt megtalálod csatolva is.\u003c/p>\u003cblockquote>\u003cp>Amint beérkezett az összeg, értesítünk, és élesedik az állásod a DreamJo.bs-on.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-3-13-dijbekero-lejart\">3.13 Díjbekérő lejárt\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>payment-expired\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Lejárt a díjbekérőd\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Sajnos lejárt az egyik díjbekérőd fizetési határideje.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megjegyzés:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ezt a díjbekérőt már nem tudod befizetni.\u003c/p>\u003cp>Ha hiba történt, és már befizetted a díjbekérőt, kérlek vedd fel velünk a kapcsolatot: :email\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-3-14-megvasarolt-csomag-jovairva\">3.14 Megvásárolt csomag jóváírva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>payment-settled\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Megvásárolt csomag jóváírásra került és felhasználható\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A megvásárolt - :packages - hirdetési csomag jóváírásra került, mostantól felhasználható :date.-ig\u003c/p>\u003cp>Lépj be az oldalra, nyisd meg a hirdetést, amit el szeretnél indítani és a felhasználható csomag(ok) melletti &quot;felhasználás&quot; gombra kattintva indítsd el azt.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-3-15-ppc-kupon-bevaltva\">3.15 PPC kupon beváltva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>used-pp-coupon\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>:coupon hirdetés beváltásra került\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:date -én 1 db \u003cstrong>:coupon hirdetés\u003c/strong> beváltásra került az alábbi álláshoz kapcsolódóan:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Egyéb info:\u003c/strong>\u003c/p>\u003cul>\u003cli>Rendelkezésre álló további hirdetések száma:\u003c/li>\u003cli>Elérhető kedvezmény kuponjaim:\u003c/li>\u003cli>\u003cstrong>CTA:\u003c/strong> További hirdetés vásárláshoz kattints IDE\u003c/li>\u003c/ul>\u003chr>\u003ch3 id=\"hu-3-16-kupon-hamarosan-lejar\">3.16 Kupon hamarosan lejár\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>coupon-expire\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Megfeledkeztél a kedvezményről?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A kedvezmény kuponod szomorú... megfeledkeztél róla? :(\u003c/p>\u003cp>Kuponkódod már csak holnap éjfélig érvényes.(:date). Ne maradj le a kedvezményről!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Promo szöveg:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>ÉPPEN NINCS NYITOTT POZÍCIÓD?\u003c/p>\u003cp>Fizess most kevesebbet, és használd fel a hirdetést a következő 6 hónapban, amikor aktuális!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Kattints ide a vásárláshoz\u003c/p>\u003chr>\u003ch2 id=\"hu-4-cegkezeles\">4. Cégkezelés\u003c/h2>\u003ch3 id=\"hu-4-1-ceg-regisztralva\">4.1 Cég regisztrálva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>company-registered\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.company-registered\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (HU piac):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdvözlünk! Sikeresen regisztráltad a cégedet! Ismerd meg a Vezérlőpultot!\u003c/p>\u003cp>- \u003cstrong>Kezdd el elkészíteni a cégprofilodat\u003c/strong> és publikáld! Ha segítségre van szükséged, nézd át a segédletünket vagy kérdezz a kijelölt kapcsolattartódtól bizalommal!\u003c/p>\u003cp>- :contact_name / :contact_phone / :contact_email\u003c/p>\u003cp>- \u003cstrong>Vedd meg az első hirdetésedet!\u003c/strong>\u003c/p>\u003cp>- \u003cstrong>Vásárolj hirdetési csomagokat!\u003c/strong> Használd ki a mennyiségi kedvezményeket! Hirdetési csomagjaink 6 hónapos beváltási határidővel használhatók fel!\u003c/p>\u003cp>- \u003cstrong>Készítsd el az ÁLLÁSHIRDETÉSEDET!\u003c/strong> Az elkészült álláshirdetéshez válaszd ki az előre megvásárolt hirdetési csomagot és publikáld!\u003c/p>\u003cp>- Nézd meg a DreamJo.bs egyéb szolgáltatásait is a Dashboardon!\u003c/p>\u003cp>- \u003cstrong>Gold Business Profil\u003c/strong> — Employer Branding szolgáltatás\u003c/p>\u003cp>- \u003cstrong>Talent Pool\u003c/strong> — Jelöltkereső szolgáltatás\u003c/p>\u003cp>Örülünk, hogy Ti is velünk vagytok!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet (RO piac):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szia!\u003c/p>\u003cp>Sikeresen regisztráltad a cégedet, és egy lépéssel közelebb kerültél ahhoz, hogy megtaláld a legmegfelelőbb jelölteket.\u003c/p>\u003cp>👉 Első lépésként hozd létre és publikáld a céges profilodat...\u003c/p>\u003cp>Köszönjük, hogy a DreamJobsot választottad!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-4-2-meghivas-ceges-szerkesztonek-meglevo-felhasznalo\">4.2 Meghívás céges szerkesztőnek (meglévő felhasználó)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>manager-added\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Meghívás céges szerkesztőnek\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>:name\u003c/strong> meghívott a(z) \u003cstrong>:company\u003c/strong> céges szerkesztőjének.\u003c/p>\u003cp>Kattints ide, hogy elfogadd a meghívást, és kezdődhet a buli!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-4-3-fiok-aktivalasa-uj-manager-letrehozva\">4.3 Fiók aktiválása (új manager létrehozva)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>added-manager\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.activateaddedaccount\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Meghívás céges szerkesztőnek: :company\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name meghívott szerkesztőnek a(z) \u003cstrong>:company\u003c/strong> céghez.\u003c/p>\u003cp>Kattints ide, hogy aktiváld a profilod, és kezdődhet a buli!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-4-4-szerkesztoi-jogosultsag-elvonva\">4.4 Szerkesztői jogosultság elvonva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>manager-remove\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Többé nem vagy a :company szerkesztője\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Gondoltuk, szólunk: mostantól kezdve nem vagy a \u003cstrong>:company\u003c/strong> szerkesztője.\u003c/p>\u003cp>A DreamJo.bs-os profilodat ezentúl is fogod tudni használni:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-4-5-szerkesztoi-profil-aktivalva\">4.5 Szerkesztői profil aktiválva\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>manager-activated\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Aktiváltuk a szerkesztői profilod\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Sikeresen aktiváltad a szerkesztői profilodat.\u003c/p>\u003cp>Már el is kezdhetsz céges profilt szerkeszteni és álláshirdetést feladni!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Segédlet:\u003c/strong> Elérhetővé tettünk egy segédlet, amiben összeszedtük, mire lesz szükséged a céges profilod megkomponálásához.  \u003cbr>\u003cstrong>CTA:\u003c/strong> Segédlet: A céges profil felépítése  \u003cbr>\u003cstrong>Dashboard info:\u003c/strong> Ismerd meg a vezérlőpultot - ez a lelke mindennek!  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Hajrá, reméljük, hamar megtaláljátok a jófej új kollégátokat!\u003c/p>\u003chr>\u003ch3 id=\"hu-4-6-manager-udvozlo-email-standard\">4.6 Manager üdvözlő email (standard)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>manager-welcome\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Sikeresen regisztráltad a szerkesztői fiókodat.\u003c/p>\u003cp>Már el is kezdhetsz céges profilt szerkeszteni és álláshirdetést feladni!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-4-7-manager-udvozlo-email-szmd-kampanyban\">4.7 Manager üdvözlő email (SZMD kampányban)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>manager-welcome-szmd\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a Dreamjobson - keressük Magyarország Szerethető Munkahelyeit!🤍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Örülünk hogy itt vagy! Sikeresen regisztráltad szerkesztői fiókodát a Dreamjobs-hoz!\u003c/p>\u003cp>\u003cstrong>Mi a következő lépés?\u003c/strong>\u003c/p>\u003cp>1. \u003cstrong>Hozd létre céges profilod\u003c/strong>: Használj különböző szolgáltatásokat a Dashboardon keresztül.\u003c/p>\u003cp>2. \u003cstrong>Tedd közzé első hirdetésed\u003c/strong>: Élj a DreamJobs előnyeivel és szolgáltatásaival.\u003c/p>\u003cp>3. \u003cstrong>Élvezd a DreamJobs nyújtotta előnyöket\u003c/strong>\u003c/p>\u003cp>Új regisztrálóként szeretnénk \u003cstrong>egy egyszeri 50%-os kedvezménykuponnal\u003c/strong> meglepni, hogy a lehető legjobban kihasználhasd az első hirdetésed értékét!\u003c/p>\u003cp>Kedvezményes kuponod az \u003cstrong>Espresso, Latte, Cappuccino és Cappuccino Extra\u003c/strong> hirdetési csomagjainkra is felhasználhatod \u003cstrong>egy hónapon\u003c/strong> belül.\u003c/p>\u003cp>\u003cstrong>Szerethető Munkahelyek Díj 2024: Mi így teszünk egy jobb világért\u003c/strong>\u003c/p>\u003cp>Publikált céges profiloddal ingyenesen nevezhetsz a Szerethető Munkahelyek versenyünkre...\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-4-8-cegblogcikk-lehetoseg-ertesito\">4.8 Cégblogcikk lehetőség értesítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>company-blog-post\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Álomállások blogcikk lehetőség :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Bevezetés:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy nálunk hirdetsz! A most indított :coupon hirdetésben foglalt blog-cikk opció kapcsán keresünk az alábbi álláshirdetésed kapcsán:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A hatékony jelentkező számhoz érdemes kihasználni a DreamJobs blog Álommelók rovata adta lehetőséget. A tapasztalatok szerint a blogcikk által átlag plusz \u003cstrong>10-15%-al nő a jelentkezők száma\u003c/strong>...\u003c/p>\u003cp>Mit kell tenned? Mellékeltünk egy rövid KÉRDÉSSORT. Töltesd ki a meghirdetett pozícióhoz hasonló munkakörben lévő kollégával...\u003c/p>\u003cp>Amennyiben szeretnétek élni a blogcikk megjelenés lehetőségével, küldjétek el a válaszaitokat az általatok relevánsnak tartott kérdésekre \u003cstrong>7 napon belül\u003c/strong>...\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-4-9-profil-torlese-megerosito\">4.9 Profil törlése megerősítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code> | \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy (dj)\u003c/strong>\u003c/td>\u003ctd>Adattörlés DreamJo.bs rendszerből\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (dj-api)\u003c/strong>\u003c/td>\u003ctd>Felhasználói adattörlés a DreamJobs rendszerből!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (dj):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Rendszerünkből a(z) :email e-mail címmel regisztrált felhasználóhoz tartozó adatok törlésének folyamata kérésedre megkezdődött.\u003c/p>\u003cp>A teljes folyamat maximum 30 napot vesz igénybe.\u003c/p>\u003cp>Ennek során a felhasználóhoz tartozó adatokat és bejegyzéseket eltávolítjuk a DreamJo.bs-ból és a kapcsolódó rendszerekből.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet (dj-api):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Rendszerünkből a(z) :email e-mail címmel regisztrált felhasználóhoz tartozó adatok törlésének folyamata kérésedre megkezdődött. Ennek során a felhasználóhoz tartozó adatokat és bejegyzéseket eltávolítjuk a DreamJobs rendszeréből.\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"hu-5-felhasznaloi-engagement-es-marketing\">5. Felhasználói Engagement és Marketing\u003c/h2>\u003ch3 id=\"hu-5-1-allasajanlasok-napi\">5.1 Állásajánlások (napi)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>recommended-jobs\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Új állások neked\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Új nap, új lehetőség!\u003c/p>\u003cp>A megjelölt kategóriák alapján az alábbi új állás(ok) érdekes lehet számodra\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Megjegyzés:\u003c/strong> Érdeklődési kategóriáidat ITT tudod pontosítani\u003c/p>\u003chr>\u003ch3 id=\"hu-5-2-allasajanlasok-heti\">5.2 Állásajánlások (heti)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>recommended-jobs-weekly\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Új munkahelyen fejlesztenéd a tudásod?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ezen a héten is új lehetőségek várnak!\u003c/p>\u003cp>A megjelölt kategóriák alapján az alábbi új állás(ok) érdekes lehet számodra\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-5-3-elmentett-allas-emlekezteto\">5.3 Elmentett állás emlékeztető\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>saved-job-reminder\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Most még tudsz jelentkezni\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Korábban sikeresen elmentetted a következő állást:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Figyelmeztetés:\u003c/strong> A jelentkezési határidő hamarosan lejár. Ne maradj le az álom állásodról, jelentkezz még ma!\u003c/p>\u003chr>\u003ch3 id=\"hu-5-4-elmentett-allas-ertesito\">5.4 Elmentett állás (értesítő)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>saved-job\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Mentett állás\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy érdeklődsz a nyitott pozíció iránt, a következő linkre kattintva fejezheted be a jelentkezésed:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"hu-5-5-b2b-hirlevel\">5.5 B2B hírlevél\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>b2b-newsletter\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>🦩 Induljon a nyár akciósan! ⛱️\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Végre itt a nyár, végre vakáció és végre 🌴 \u003cstrong>DREAMJOBS NYÁRINDÍTÓ AKCIÓ\u003c/strong>! 🌊\u003c/p>\u003cp>Lépj be céges profilodra, keresd a dashboardon a \u003cstrong>Nyarindito25\u003c/strong> kupont és használd fel a 25%-os kedvezményedet Latte, Cappuccino vagy Cappuccino Extra csomagjainkra!\u003c/p>\u003cp>Az akció időtartama: 2022. június 16-20.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Irány a dashboard!\u003c/p>\u003chr>\u003ch3 id=\"hu-5-6-virtual-bench-ertesito-feliratkozas-visszaigazolas\">5.6 Virtual Bench értesítő (feliratkozás visszaigazolás)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>virtualbench\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Dolgoznék itt!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dolgoznál itt? A \u003cstrong>:company\u003c/strong> céghez való feliratkozással mostantól elsőként kapsz értesítést az itt megnyíló állásajánlatokról.\u003c/p>\u003cp>A kedvelt cégeidet a személyes fiókodban, a profil menüpont alatt tudod menedzselni.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üdvözlet:\u003c/strong> Jó nézelődést és drukkolunk, hogy megtaláld az a csapatot, akik már várnak Rád!\u003c/p>\u003chr>\u003ch3 id=\"hu-5-7-virtual-bench-hirlevel-preferenciak-kerese\">5.7 Virtual Bench hírlevél (preferenciák kérése)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>virtualbench-newsletter\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Szívesen dolgoznál náluk? Add meg, hogy milyen terület érdekel!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Korábban jelezted, hogy szívesen dolgoznál a(z) \u003cstrong>:company\u003c/strong> munkatársaként.\u003c/p>\u003cp>Add meg, vagy aktualizáld profilodban, hogy milyen területen, milyen szintű pozíció érdekelne, hogy tudathassuk a céggel is!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Ugrás a profilomra!\u003c/p>\u003chr>\u003ch3 id=\"hu-5-8-virtual-bench-hirlevel-v2\">5.8 Virtual Bench hírlevél v2\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>virtualbench-newsletter-2\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Dolgoznál itt? Milyen terület érdekelne?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/stro any-profile\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Elakadtál a cégprofil szerkesztéssel?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Elakadtál a cégprofil szerkesztéssel? Kapcsolattartóink szívesen segítenek - legyen szó a szolgáltatásainkról, vagy a cégprofil kreatív kitöltéséről.\u003c/p>\u003cp>Keresd :contact:\u003c/p>\u003cp>- E-mail: :email\u003c/p>\u003cp>- Tel: :phone\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Promo:\u003c/strong> Legyetek ti is a Szerethető Cégek közösségének tagja és mutassátok be magatokat :country első és egyedülálló employer branding platformján!\u003c/p>\u003chr>\u003ch3 id=\"hu-5-11-lovable-workplaces-szavazas\">5.11 Lovable Workplaces szavazás\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>lovable-workplaces-voting\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>⭐ Elindult a Lovable Workplaces szavazás! 🚀\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szia! 👋\u003c/p>\u003cp>A kedvenc céged megérdemli, hogy a legjobb legyen! ⭐\u003c/p>\u003cp>Elindult a Lovable Workplaces szavazás.\u003c/p>\u003cp>Nagyon egyszerűen szavazhatsz:\u003c/p>\u003cp>🔎 Keresd meg a kedvenc cégedet a keresőben és szavazz rá közvetlenül az oldaláról.\u003c/p>\u003cp>Vagy\u003c/p>\u003cp>🎯 Lépj be a „Lovable Workplaces szavazás&quot; menüpontba, ahol 5 véletlenszerű céget kapsz, amire szavazhatsz.\u003c/p>\u003cp>Fontos: Csak akkor szava
