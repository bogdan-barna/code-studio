/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>În ultimele săptămâni, luni, te-ai abonat la lista de preferințe a unei companii care ți-a plăcut. Avem vești bune, deoarece compania caută un nou membru pentru echipă.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Informație:\u003c/strong> Nu-ți face griji, datele tale personale vor fi tratate confidențial, aplicația ta va fi vizibilă doar pentru noi, iar alte companii nu vor avea acces la ea! Te poți dezabona oricând sau aici poți edita lista ta de companii la care ai dori să lucrezi!  \u003cbr>\u003cstrong>Urare:\u003c/strong> O privire plăcută, sperăm că vei găsi cât mai curând jobul visurilor tale!\u003c/p>\u003chr>\u003ch3 id=\"ro-5-10-profil-de-companie-incomplet-memento\">5.10 Profil de companie incomplet — memento\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>unfinished-company-profile\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ai întâmpinat dificultăți în completarea profilului firmei tale?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ai întâmpinat dificultăți în completarea profilului firmei tale? Colegii noștri te ajută cu mare plăcere!\u003c/p>\u003cp>Contactează-ne :contact:\u003c/p>\u003cp>- E-mail: :email\u003c/p>\u003cp>- Tel: :phone\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-5-11-vot-lovable-workplaces\">5.11 Vot Lovable Workplaces\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>lovable-workplaces-voting\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>⭐ A început votul Lovable Workplaces! 🚀\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Salut! 👋\u003c/p>\u003cp>Compania ta preferată merită să fie cea mai bună! ⭐\u003c/p>\u003cp>A început votul Lovable Workplaces.\u003c/p>\u003cp>Poți vota foarte simplu:\u003c/p>\u003cp>🔎 Caută compania ta preferată în bară de căutare și votează direct de pe pagina ei.\u003c/p>\u003cp>Sau\u003c/p>\u003cp>🎯 Accesează meniu „Votul Lovable Workplaces&quot;, unde primești 5 companii aleatorii pentru care poți vota.\u003c/p>\u003cp>Important: Poți vota doar dacă te înregistrezi pe platformă!\u003c/p>\u003cp>🎁 Cu fiecare vot acordat, îți mărești șansele la premii valoroase.\u003c/p>\u003cp>Intră acum, găsește compania ta preferată și votează!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Urare:\u003c/strong> Mult succes 🚀!\u003c/p>\u003chr>\u003ch3 id=\"ro-5-12-newsletter-general\">5.12 Newsletter general\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>newsletter\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Buletin informativ\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Blocuri de conținut:\u003c/strong>\u003c/p>\u003cul>\u003cli>Aruncă o privire la cele mai recente poziții noastre deschise\u003c/li>\u003cli>Ți-am selectat și ofertele de joburi evidențiate de pe DreamJobs\u003c/li>\u003cli>Acestea sunt cele mai noi companii iubibile ale noastre:\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Urare:\u003c/strong> Îți dorim să găsești echipa care te așteaptă deja să lucreze cu tine.\u003c/p>\u003chr>\u003ch2 id=\"ro-6-devchallenge\">6. DevChallenge\u003c/h2>\u003ch3 id=\"ro-6-1-competitie-noua-lansata\">6.1 Competiție nouă lansată\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-new-challenge\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Competiția :title a început pe DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Nu rata! Competiția \u003cstrong>:title\u003c/strong> tocmai a început pe DevChallenge! Și în această lună poți câștiga premii valoroase dacă te afli pe podium la sfârșitul concursului!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Mă alătur competiției  \u003cbr>\u003cstrong>Link:\u003c/strong> Despre ce este competiția?\u003c/p>\u003chr>\u003ch3 id=\"ro-6-2-bun-venit-dupa-inregistrare-dc\">6.2 Bun venit (după înregistrare DC)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-welcome\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bun venit pe DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări, înregistrarea ta pe DevChallenge a reușit!\u003c/p>\u003cp>Testează-te în mai multe limbaje de programare și încearcă și subiectele amuzante!\u003c/p>\u003cp>Nu uita: poți completa mai multe seturi de întrebări pe categorie și poți chiar să-ți provoci prietenii, ca să nu mai vorbim de premiile valoroase!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Să înceapă completarea chestionarelor!\u003c/p>\u003chr>\u003ch3 id=\"ro-6-3-activitate-utilizator-7-zile-activ\">6.3 Activitate utilizator (7 zile, activ)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-user-active\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect (7 zile)\u003c/strong>\u003c/td>\u003ctd>Te așteaptă mai multe chestionare pe DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (15 zile)\u003c/strong>\u003c/td>\u003ctd>Te așteptăm înapoi pe DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (30 zile)\u003c/strong>\u003c/td>\u003ctd>Îți mulțumim că ești alături de noi de o lună pe DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj 7 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ne bucurăm că ești deja de o săptămână un membru activ al comunității DevChallenge!\u003c/p>\u003cp>Și în acest timp nu ai stat degeaba, ai completat deja :total chestionare! Ca relaxare, încearcă și chestionarele noastre amuzante:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj 15 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>De cincisprezece zile ești înregistrat în comunitatea DevChallenge și în acest timp ai completat :total chestionare!\u003c/p>\u003cp>Activitate fantastică! Pe baza completărilor tale anterioare, îți recomandăm și aceste chestionare:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj 30 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A trecut deja o lună de când te-ai alăturat comunității DevChallenge! Mulțumiri speciale pentru că în acest timp ai participat activ și la completarea chestionarelor! Ai mai încercat aceste chestionare ale noastre?\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-6-4-activitate-utilizator-utilizatori-inactivi\">6.4 Activitate utilizator (utilizatori inactivi)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-user-inactive\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect (7 zile)\u003c/strong>\u003c/td>\u003ctd>Te așteptăm înapoi pe DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (15 zile)\u003c/strong>\u003c/td>\u003ctd>Chestionare interesante te așteaptă pe DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (15 zile v2)\u003c/strong>\u003c/td>\u003ctd>E momentul să te testezi cu chestionarele DevChallenge!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Subiect (30 zile)\u003c/strong>\u003c/td>\u003ctd>Te așteaptă DevChallenge de o lună!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj 7 zile:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți mulțumim că ești deja de o săptămână membru al comunității DevChallenge. Cu tristețe observăm că în acest timp ai completat doar câteva chestionare. Pe baza completărilor tale anterioare, credem că aceste chestionare te-ar putea interesa:\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-6-5-seria-ta-este-in-pericol\">6.5 Seria ta este în pericol\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-user-streak\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Seria ta este în pericol!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Completează un chestionar pentru ca seria ta să nu se piardă!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Completez un chestionar\u003c/p>\u003chr>\u003ch3 id=\"ro-6-6-rezultate-saptamanale\">6.6 Rezultate săptămânale\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>dc-weekly-results\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Acesta a fost săptămâna ta pe DevChallenge!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți mulțumim că ai fost activ pe DevChallenge și săptămâna aceasta! Cu răspunsurile tale la chestionarele noastre, ai obținut următoarele rezultate:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Format statistici:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Cu răspunsurile tale, te afli pe locul \u003cstrong>:weekly\u003c/strong> în clasamentul săptămânal al categoriei \u003cstrong>:category\u003c/strong>.\u003c/p>\u003cp>Locul tău în clasamentul general săptămâna aceasta: \u003cstrong>:alltime.\u003c/strong>\u003c/p>\u003cp>Ai completat \u003cstrong>:quizes\u003c/strong> chestionare în categoria \u003cstrong>:category\u003c/strong>.\u003c/p>\u003cp>Acuratețea actuală a răspunsurilor tale în categoria \u003cstrong>:category\u003c/strong>: \u003cstrong>:accuracy\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Motivare:\u003c/strong> Vrei rezultate și mai bune? Iată un chestionar cu care poți urca în clasament:  \u003cbr>\u003cstrong>Urare:\u003c/strong> Îți dorim mult succes și săptămâna viitoare!\u003c/p>\u003chr>\u003ch2 id=\"ro-7-locuri-de-munca-iubibile-szmd-lovable-workplaces\">7. Locuri de Muncă Iubibile (SZMD/Lovable Workplaces)\u003c/h2>\u003ch3 id=\"ro-7-1-nominalizare-retrasa\">7.1 Nominalizare retrasă\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>szmd-redact\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Retrage nominalizarea SZMD:year\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003ca href=\":url\">:company\u003c/a> și-a retras nominalizarea pentru :year SZMD.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-7-2-renominalizare\">7.2 Renominalizare\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>szmd-renominate\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Renominalizarea SZMD:year\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Great news — \u003ca href=\":url\">:company\u003c/a> has decided to jump back in and renominate for the \u003cstrong>Lovable Workplaces Award!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cem>(Notă: textul este în engleză în fișierul sursă RO)\u003c/em>\u003c/p>\u003chr>\u003ch3 id=\"ro-7-3-campanie-promo-lovable-workplaces-ro-editie\">7.3 Campanie promo Lovable Workplaces (RO ediție)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>szmd-promo-ro\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Sunteți un loc de muncă lovable? Înregistrați-vă acum!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>În al treilea an, lansăm competiția Locuri de Muncă Iubibile în :szmd_year! Anul acesta, 30 de companii vor primi Premiul Locuri de Muncă Iubibile, dintre care 3 vor fi selectate de juriu pentru Premiul Special Employer Branding. Înscrierea începe astăzi!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-7-4-campanie-promo-lovable-workplaces-standard\">7.4 Campanie promo Lovable Workplaces (standard)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>szmd-promo\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Sunteți un loc de muncă lovable? Înregistrați-vă acum!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>În :szmd_year lansăm concursul Lovable Workplaces pentru al șaselea an consecutiv! Anul acesta 30 de companii vor primi premiul Lovable Workplaces, dintre care 6 vor fi selectate de juriu pentru premiile profesionale speciale în categoriile HR și Employer Branding. Intrarea începe astăzi!\u003c/p>\u003cp>Tema concursului Lovable Workplaces din acest an este: \u003cstrong>Creșterea digitalizării în lumea muncii. Arată-ne care sunt soluțiile tale digitale preferate\u003c/strong>: adaugă-le la profilul tău!\u003c/p>\u003cp>Rolul soluțiilor digitale a crescut rapid în ultimii ani, în special în lumea muncii...\u003c/p>\u003cp>Ținem pumnii pentru voi, așteptăm să vă vedem printre câștigătorii noștri în :szmd_year!\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"ro-8-smart-bench-profile-sbp\">8. Smart Bench Profile (SBP)\u003c/h2>\u003ch3 id=\"ro-8-1-profil-sbp-adaugat-in-baza-de-date-publica\">8.1 Profil SBP adăugat în baza de date publică\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>sbp-b2c\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>😱 Acum poți primi direct oferte de joburi! Actualizează-ți profilul! ☝️ 😉\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Suntem bucuroși să te informăm că profilul tău de self-branding a fost adăugat în \u003cstrong>bazele noastre de date publice, accesibile companiilor\u003c/strong>. Astfel, angajatorii pot acum \u003cstrong>să te contacteze direct cu ofertele lor de joburi\u003c/strong>. Este momentul să îți actualizezi și să faci profilul tău și mai atractiv!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> ÎMI ACTUALIZEZ PROFILUL  \u003cbr>\u003cstrong>Opțiune dezactivare:\u003c/strong> Ha nem szeretnéd, hogy a profilod közvetlenül elérhető legyen a munkáltatók számára, egy kattintással ki tudod kapcsolni ezt a szolgáltatást a fiókodban!\u003cbr>\u003cem>(Notă: textul de dezactivare este în HU în fișierul sursă RO — necesită corecție)\u003c/em>\u003c/p>\u003chr>\u003ch3 id=\"ro-8-2-pdf-sbp-creat\">8.2 PDF SBP creat\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>sbp-pdf\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ai creat un CV unic și inteligent, folosește-l!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Felicitări!\u003c/p>\u003cp>Ai finalizat cu succes profilul tău de Self-branding, și astfel ai șanse mai mari să aplici pentru job-ul mult visat.\u003c/p>\u003cp>În plus ți-am trimis versiunea de \u003cstrong>PDF a CV-ului tău\u003c/strong>, pe care o poți folosi oricând fie pe :site, fie pe un alt portal de locuri de muncă. \u003cstrong>Vezi CV-ul tău în atașament!\u003c/strong>\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Slogan:\u003c/strong> Ieși din mulțime și găsește jobul visurilor tale!  \u003cbr>\u003cstrong>CTA:\u003c/strong> Nu mai ai altceva de făcut decât să dai click aici și să te prezinți viitorului tău angajator!\u003c/p>\u003chr>\u003ch3 id=\"ro-8-3-profil-sbp-creat-dj-api\">8.3 Profil SBP creat (dj-api)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>sbp_profile_created\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Profilul tău Self-Branding este gata!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bună :name!\u003c/p>\u003cp>Procesatorul nostru de CV-uri bazat pe AI al DreamJobs a creat cu succes profilul tău de Self-Branding.\u003c/p>\u003cp>Dacă simți că ceva nu este corect în profilul tău, îți poți actualiza datele oricând.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Vizualizează-ți profilul\u003c/p>\u003chr>\u003ch3 id=\"ro-8-4-credit-gratuit-talent-pool-sbp\">8.4 Credit gratuit Talent Pool SBP\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>sbp-search-free-credit\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Cadou: Contact Credit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Avem vești bune! Dacă utilizezi pachetele achiziționate Cappuccino/Cappuccino Extra până la \u003cstrong>:date\u003c/strong>, vei primi 2 credite de contact pentru fiecare anunț de angajare Cappuccino și 4 credite de contact pentru Cappuccino Extra, pe care le poți utiliza în DreamJobs Talent Pool.\u003c/p>\u003cp>Ce este Talent Pool-ul?\u003c/p>\u003cp>\u003cstrong>Talent Pool Candidate Finder\u003c/strong> este un skill de căutare bazat pe abilitățile candidaților. Prin această metodă, pe baza preferințelor tale, poți vedea prezentările candidaților activi și pasivi. Din această bază de date, poți salva pe cei mai potriviți candidați. Iar dacă găsești pe cineva cu o ofertă de muncă, poți accesa datele lui prin valorificarea unui credit de contact.\u003c/p>\u003cp>Creditele de contact vor fi disponibile pe Dashboard, în pachete de 10 și 35 de bucăți.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-8-5-lansare-talent-pool-sbp\">8.5 Lansare Talent Pool SBP\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>sbp-search-lunch\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Serviciul al DreamJobs Talent Pool Candidate Finder a început!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Serviciul &quot;pick and hire&quot; al DreamJobs \u003cstrong>Talent Pool Candidate Finder\u003c/strong> a început! Ce înseamnă asta? Este un skill de căutare bazat pe abilitățile candidaților...\u003c/p>\u003cp>Promoție introductivă: \u003cstrong>până la 30 aprilie 2022\u003c/strong>, vom adăuga \u003cstrong>2 credite\u003c/strong> de contact la fiecare anunț de job \u003cstrong>Cappuccino\u003c/strong> și \u003cstrong>4 credite\u003c/strong> de contact la \u003cstrong>Cappuccino Extra\u003c/strong>. Creditele pot fi folosite până la expirarea anunțului.\u003c/p>\u003c/blockquote>\u003chr>\u003ch2 id=\"ro-9-distribuire-si-invitatii\">9. Distribuire și Invitații\u003c/h2>\u003ch3 id=\"ro-9-1-link-distribuit-pe-email-job\">9.1 Link distribuit pe email (job)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>share-job\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>:from ți-a trimis un link\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name ți-a trimis un link către o anunț de job de pe site-ul DreamJobs Romania\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Uită-te la anunțul de job\u003c/p>\u003chr>\u003ch3 id=\"ro-9-2-link-distribuit-pe-email-companie\">9.2 Link distribuit pe email (companie)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>share-company\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>:from ți-a trimis un link\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>:name ți-a trimis un link către profilul unei companii de pe site-ul DreamJobs Romania\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Uită-te la profilul companiei\u003c/p>\u003chr>\u003ch2 id=\"ro-10-recenzii\">10. Recenzii\u003c/h2>\u003ch3 id=\"ro-10-1-notificare-recenzie-job\">10.1 Notificare recenzie job\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>job-review\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.jobreviewcreated\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Sugestie nouă\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Am examinat anunțul de job din perspective HR și Marketing și avem următoarele sugestii:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Modific anunțul meu  \u003cbr>\u003cstrong>Sugestie:\u003c/strong> Te rugăm să modifici anunțul cât mai curând pentru o relevanță mai mare și mai mulți candidați.  \u003cbr>\u003cstrong>Mulțumire:\u003c/strong> Îți mulțumim că publici la noi!  \u003cbr>\u003cstrong>Ajutor:\u003c/strong> Dacă ai alte întrebări, nu ezita să contactezi persoana de contact DreamJobs.\u003c/p>\u003chr>\u003ch2 id=\"ro-11-administrare-si-altele\">11. Administrare și Altele\u003c/h2>\u003ch3 id=\"ro-11-1-interes-profil-gold-solicitantului\">11.1 Interes profil Gold (solicitantului)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>gold-request-b2b\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Interes față de profilul GOLD DreamJobs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Am primit cu plăcere interesul tău față de serviciul nostru GOLD Profile.\u003c/p>\u003cp>Colegul nostru te va contacta în curând pentru a discuta detaliile și a te ajuta cu comanda.\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-11-2-consiliere-in-cariera-pentru-admin\">11.2 Consiliere în carieră (pentru admin)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003cem>(șablon: \u003ccode>mail.admin_asked_for_career_advice\u003c/code>)\u003c/em>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Consiliere în carieră: :name\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cem>(Notificare internă admin — conține numele utilizatorului, e-mail, comentarii și fișiere)\u003c/em>\u003c/p>\u003chr>\u003ch3 id=\"ro-11-3-comanda-candidate-shortlist\">11.3 Comandă Candidate Shortlist\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003cem>(șablon: \u003ccode>mail.candidate_shortlist\u003c/code>)\u003c/em>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>:name - Comandă Candidate Shortlist\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cem>(Notificare internă admin)\u003c/em>\u003c/p>\u003chr>\u003ch3 id=\"ro-11-4-recomandare-sourcing\">11.4 Recomandare Sourcing\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>csl-recomendation\u003c/code>\u003c/p>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Anunțul tău de job rulează de 14 zile.\u003c/p>\u003cp>Dacă nu ești mulțumit de candidați, dorim să îți atragem atenția asupra serviciului nostru de SOURCING, cu ajutorul căruia îți aducem potențiali angajați care sunt deschiși la ofertele voastre.\u003c/p>\u003cp>În plus, poți primi înapoi prețul pachetului de publicare!\u003c/p>\u003c/blockquote>\u003chr>\u003ch3 id=\"ro-11-5-promotie-craciun-pasti\">11.5 Promoție Crăciun/Paști\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>xmashunt\u003c/code>\u003c/p>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Acțiunea XMASHUNT!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj (pentru companii):\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ai primit un cupon de :discount % reducere ca parte a promoției de Crăciun „XMASHUNT&quot;.\u003c/p>\u003cp>Cod cupon: :coupon\u003c/p>\u003cp>Cuponul poate fi folosit pentru următoarele anunțuri: Latte, Cappuccino.\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Urare:\u003c/strong> \u003cem>(nu este specificat în fișierul sursă — se deduce din context: Crăciun fericit!)\u003c/em>\u003c/p>\u003chr>\u003ch3 id=\"ro-11-6-elemente-de-subsol-ale-notificarilor\">11.6 Elemente de subsol ale notificărilor\u003c/h3>\u003cdiv class=\"doc-table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Element\u003c/th>\u003cth>Text\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Dezabonare\u003c/td>\u003ctd>Dorești să te dezabonezi de la această listă? Poți face asta apăsând aici\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Adresă poștală\u003c/td>\u003ctd>Adresa noastră poștală\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Salutare\u003c/td>\u003ctd>Numai bine / Toate cele bune\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Intro\u003c/td>\u003ctd>Bună / Dragă :name! / Salut :name!\u003c/td>\u003c/tr>\u003ctr>\u003ctd> const emails=[{"id":1,"section":"1.1","trigger":"User registers via dj (legacy/dashboard)","origin":"dj","handler":"RegisteredEventListener → UserRegistered","recipient":"New user","type":"Transactional — Welcome","template":"mail.welcome ✅","status":"Nem törölhető","priority":"Magas","title":"Üdvözlő email (dj — dashboard felhasználó)","huTitle":"1.1 Üdvözlő email (dj — dashboard felhasználó)","roTitle":"1.1 Email de bun venit (dj — utilizator dashboard)","huHtml":"\u003ch3>1.1 Üdvözlő email (dj — dashboard felhasználó)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.welcome\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a jófej álláskeresők közt, mi a DreamJo.bs-nál nagyon örülünk, hogy csatlakoztál!\u003c/p>\u003cp>Reméljük, hamar megtalálod, amit keresel, legyen az rugalmas munkaidő, kutyabarát office, vagy egyszerűen csak magasabb fizetés.\u003c/p>\u003cp>Mutatjuk, hol találod az ország legszerethetőbb állásait:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Aláírás:\u003c/strong> Nagyon szurkolunk, eredményes álláskeresést!\u003c/p>","roHtml":"\u003ch3>1.1 Email de bun venit (dj — utilizator dashboard)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail.welcome\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe Dreamjobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bine ai venit! Noi, cei de la DreamJobs suntem foarte bucuroși, că ești alături de noi!\u003c/p>\u003cp>Sperăm, că vei găsi rapid ceea ce dorești: muncă flexibilă, un office captivant, sau pur și simplu un salariu mai bun.\u003c/p>\u003cp>Îți arătăm, unde găsești cele mai bune joburi:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Semnătură:\u003c/strong> Ținem pumnii, îți dorim succes în căutarea jobului perfect!\u003c/p>","auditIds":[5]},{"id":2,"section":"1.2","trigger":"User registers via Nuxt","origin":"dj-nuxt → dj-api","handler":"WelcomeNotificationListener → WelcomeNotification","recipient":"New user","type":"Transactional — Welcome","template":"mail.welcome ✅","status":"Nem törölhető","priority":"Magas","title":"Üdvözlő email (dj-api — job seeker regisztráció)","huTitle":"1.2 Üdvözlő email (dj-api — job seeker regisztráció)","roTitle":"1.2 Email de bun venit (dj-api — înregistrare job seeker)","huHtml":"\u003ch3>1.2 Üdvözlő email (dj-api — job seeker regisztráció)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs-on!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a DreamJobs-nál, örülünk, hogy itt vagy!\u003c/p>\u003cp>Bízunk benne, hogy hamarosan rátalálsz új álommunkahelyedre - jelentsen ez rugalmas munkaidőt, összetartó csapatot vagy épp szintlépést a karrieredben.\u003c/p>\u003cp>Nézz be a cégek kulisszái mögé, és válassz a hozzád illő pozíciók közül:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Self-Branding promo blokk:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Szeretnénk hatékonyan támogatni az álláskeresésben, ezért készítettük el egyedi álláskeresői megoldásunkat. Self-Branding profiljainkkal kitűnhetsz a többi jelölt közül, és kiemelheted a jelentkezésed - mutasd be kreatív eszköztárunk segítségével, hogy miben vagy erős, mitől vagy különleges!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Megnézem az állásokat | Elkészítem a Self-Branding profilom  \u003cbr>\u003cstrong>Üdvözlet:\u003c/strong> Sikeres álláskeresést kívánunk a Csapatunk nevében!  \u003cbr>\u003cstrong>Segítség:\u003c/strong> Ha bármiben segíthetünk, nyugodtan keress minket a hello@dreamjobs.hu címen.\u003c/p>","roHtml":"\u003ch3>1.2 Email de bun venit (dj-api — înregistrare job seeker)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>welcome\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/welcome.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Bun venit la DreamJobs, ne bucurăm că ești alături de noi!\u003c/p>\u003cp>Suntem siguri că vei găsi noul tău loc de muncă de vis în curând - fie că este vorba de un program de lucru flexibil, de o echipă sudată sau de oportunitatea de a avansa în carieră.\u003c/p>\u003cp>Aruncă o privire în culisele companiilor și alege din pozițiile care ți se potrivesc:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Bloc promo Self-Branding:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dorim să te sprijinim eficient în căutarea unui loc de muncă, de aceea am creat soluția noastră unică pentru căutarea unui job. Profilul tău de Self-Branding te ajută să ieși în evidență față de alți candidați și să îți prezinți candidatura într-un mod autentic și convingător. Folosește instrumentele noastre creative pentru a arăta ce abilități te definesc și ce te face unic!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> Văd joburile disponibile | Îmi creez profilul Self-Branding  \u003cbr>\u003cstrong>Urare:\u003c/strong> Îți ținem pumnii, mult succes în căutarea jobului perfect!  \u003cbr>\u003cstrong>Ajutor:\u003c/strong> Dacă te putem ajuta cu orice informație, scrie-ne un mail pe business@dreamjobs.ro.\u003c/p>","auditIds":[1]},{"id":3,"section":"1.3","trigger":"User registers via Nuxt","origin":"dj-nuxt → dj-api","handler":"WelcomeNotificationListener → WelcomeNotification","recipient":"New user","type":"Transactional — Welcome","template":"mail.welcome ✅","status":"Nem törölhető","priority":"Magas","title":"Üdvözlő email (dj-api — RO piac, magyar nyelvű változat)","huTitle":"1.3 Üdvözlő email (dj-api — RO piac, magyar nyelvű változat)","roTitle":"1.3 Email de bun venit (dj-api — RO market, variantă specifică)","huHtml":"\u003ch3>1.3 Üdvözlő email (dj-api — RO piac, magyar nyelvű változat)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj-api/lang/hu/ro-mail.php\u003c/code> → \u003ccode>welcome\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a DreamJobs Romania oldalon!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Üdv a jófej álláskeresők közt, mi a DreamJobs-nál nagyon örülünk, hogy csatlakoztál!\u003c/p>\u003c de.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Feliratkoztál a DreamJobs állásértesítőjére\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Kedves :name!\u003c/p>\u003cp>Sikeresen feliratkoztál az állásértesítő hírlevelünkre, így egy lépéssel közelebb kerültél, hogy rátalálj új munkahelyedre.\u003c/p>\u003cp>Mostantól a megadott érdeklődési körök alapján személyre szabott állásértesítőket küldünk neked, hogy minél gyorsabban rátalálj a következő nagy lehetőségre – legyen az rugalmas munkaidő, inspiráló munkakörnyezet, kutyabarát iroda vagy épp vonzóbb juttatási csomag.\u003c/p>\u003cp>A belépéshez szükséges ideiglenes jelszavad: \u003cstrong>:pw\u003c/strong>\u003c/p>\u003cp>Ha úgy érzed, túl sok értesítést kapsz, a levelek alján található Leiratkozás gombra kattintva, vagy IDE KATTINTVA könnyedén módosíthatod a beállításaidat.\u003c/p>\u003cp>Kérdés esetén írj bátran a :address címre.\u003c/p>\u003cp>Sikeres álláskeresést kívánunk!\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>1.9 Confirmare abonare la notificări de joburi\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj-api/lang/ro/mail.php\u003c/code> → \u003ccode>job-notification\u003c/code>  \u003cbr>\u003cstrong>Șablon:\u003c/strong> \u003ccode>mail/job-notification.blade.php\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Ești abonat la alerta de joburi DreamJobs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dragă :name,\u003c/p>\u003cp>Te-ai abonat cu succes la newsletter-ul nostru de alerte de joburi, deci ești cu un pas mai aproape de a-ți găsi noul loc de muncă.\u003c/p>\u003cp>De acum înainte, îți vom trimite alerte de joburi personalizate pe baza ariei de interes selectate, pentru a te ajuta să găsești mai rapid următoarea ta mare oportunitate - fie că este vorba de un program de lucru flexibil, de un mediu de lucru inspirațional, de un birou pet-friendly sau de un pachet de beneficii mai atractiv.\u003c/p>\u003cp>Parola ta temporară de acces: \u003cstrong>:pw\u003c/strong>\u003c/p>\u003cp>Dacă simți că primești prea multe notificări, poți accesa cu ușurință setările tale, fie dând clic pe butonul Dezabonare din josul e-mailurilor noastre, fie CLICK AICI.\u003c/p>\u003cp>În caz de întrebări, nu ezita să ne contactezi la :address.\u003c/p>\u003cp>Îți dorim mult succes în căutarea jobului ideal!\u003c/p>\u003c/blockquote>","auditIds":[41]},{"id":10,"section":"2.1","trigger":"Job application submitted (dj legacy)","origin":"dj","handler":"Frontend\\JobApplication listener → AppliedToJob Mailable","recipient":"Applicant","type":"Transactional — Application Confirmation","template":"mail.applied_to_job (Markdown) ⚡","status":"Nem törölhető","priority":"Magas","title":"Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)","huTitle":"2.1 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)","roTitle":"2.1 Aplicație reușită (B2C — confirmare pentru candidat, dj)","huHtml":"\u003ch3>2.1 Sikeres állásjelentkezés (B2C — jelölt visszaigazoló, dj)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>applied-to-job\u003c/code>  \u003cbr>\u003cstrong>Sablon:\u003c/strong> \u003ccode>mail.applied_to_job\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Sikeres állásje cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>\u003cem>(tárgy a sablonban van meghatározva)\u003c/em>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Kedves Jelentkező!\u003c/p>\u003cp>Korábban jelentkeztél a(z) \u003cstrong>:job @ :company\u003c/strong> állásra.\u003c/p>\u003cp>Az álláshirdetés lezárult. Amennyiben alkalmasnak találnak a pozícióra, hamarosan felveszik veled a kapcsolatot.\u003c/p>\u003cp>Addig is nézz szét aktuális állásajánlataink között! »\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>3.8 Job închis — notificare candidați\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>closed-job-page.mail-text\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>\u003cem>(definit în șablon)\u003c/em>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Dragă Candidat,\u003c/p>\u003cp>Anterior ai candidat la poziția \u003cstrong>:job @ :company\u003c/strong>.\u003c/p>\u003cp>Anunțul de job s-a închis. Dacă ești considerat potrivit pentru poziție, vei fi contactat în curând.\u003c/p>\u003cp>Între timp, uită-te la ofertele noastre actuale de joburi! »\u003c/p>\u003c/blockquote>","auditIds":[38]},{"id":24,"section":"3.9","trigger":"Job plan upgrade offer (scheduled)","origin":"dj","handler":"SendJobPlanUpgradeEmail command → JobPlanUpgrade","recipient":"Company","type":"Marketing — Upgrade Offer","template":"mail.job_plan_upgrade 📅","status":"Törölhető / letiltható","priority":"Alacsony","title":"Hirdetési csomag upgrade ajánlat","huTitle":"3.9 Hirdetési csomag upgrade ajánlat","roTitle":"3.9 Ofertă upgrade pachet de job","huHtml":"\u003ch3>3.9 Hirdetési csomag upgrade ajánlat\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>job-plan-upgrade\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Időszaki DreamJo.bs Job Riport :job - Upgrade opció\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Tájékoztatunk, hogy ez a típusú és szenioritású állást \u003cstrong>ajánlásunk szerint az alábbi csomagban érdemes hirdetni:\u003c/strong> :plans\u003c/p>\u003cp>További információk a hirdetési csomagok kapcsán: ÁRLISTA\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Lehetőségek:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>UPGRADE:\u003c/strong> Vásárolj nagyobb hirdetést! Állítsd le \u003cstrong>7 napon belül\u003c/strong>, duplikáld, indítsd újra a nagyobb csomagban jelenlegi hirdetésed! Leállított hirdetésed értékét kedvezmény kupon formájában kapod vissza.\u003c/p>\u003cp>\u003cstrong>LEJÁRAT UTÁNI ÚJRA HIRDETÉS:\u003c/strong> Vásárolj nagyobb hirdetést \u003cstrong>még MA\u003c/strong>, használd fel 6 hónapon belül!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Csomagok ajánlás:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>- \u003cstrong>Espresso:\u003c/strong> 3.500 - 5.000 reach (Pályakezdő, általános Junior állásokhoz)\u003c/p>\u003cp>- \u003cstrong>Latte:\u003c/strong> 20.000 - 30.000 reach (Junior IT, Medior szintű egyéb állásokhoz)\u003c/p>\u003cp>- \u003cstrong>Cappuccino:\u003c/strong> 50.000 - 70.000 reach (Medior és Senior IT állások, egyéb Senior állásokhoz)\u003c/p>\u003cp>- \u003cstrong>Cappuccino Extra:\u003c/strong> 100.000 - 140.000 reach (nehéz IT pozíciókhoz, folyamatos kereséshez)\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>CTA:\u003c/strong> ÚJ HIRDETÉS VÁSÁRLÁS KEDVEZMÉNNYEL  \u003cbr>\u003cstrong>Köszönet:\u003c/strong> Köszönjük, hogy a DreamJo.bs-on hirdetsz!\u003c/p>","roHtml":"\u003ch3>3.9 Ofertă upgrade pachet de job\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>job-plan-upgrade\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Raport periodic DreamJobs :job - Opțiune upgrade\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Vă informăm că, conform recomandărilor noastre, \u003cstrong>acest tip și nivel de seniority al jobului este cel mai bine publicat în pachetul următor:\u003c/strong> :plans\u003c/p>\u003cp>Mai multe informații despre pachetele de publicare: LISTA DE PREȚURI\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Opțiuni:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>\u003cstrong>UPGRADE:\u003c/strong> Cumpărați un anunț mai mare! Opriți \u003cstrong>în 7 zile\u003c/strong>, duplicați, republicați în pachetul mai mare! Veți primi valoarea anunțului oprit sub formă de cupon de reducere.\u003c/p>\u003cp>\u003cstrong>REPUBLICARE DUPĂ EXPIRARE:\u003c/strong> Cumpărați un anunț mai mare \u003cstrong>ACUM\u003c/strong>, utilizați-l în decurs de 6 luni!\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Pachete recomandate:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>- \u003cstrong>Espresso:\u003c/strong> 3.500 - 5.000 reach (pentru joburi de nivel entry, junior general)\u003c/p>\u003cp>- \u003cstrong>Latte:\u003c/strong> 20.000 - 30.000 reach (IT Junior, alte joburi nivel Medior)\u003c/p>\u003cp>- \u003cstrong>Cappuccino:\u003c/str itle":"4.7 Manager üdvözlő email (SZMD kampányban)","roTitle":"4.7 Email de bun venit manager (campanie SZMD)","huHtml":"\u003ch3>4.7 Manager üdvözlő email (SZMD kampányban)\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>manager-welcome-szmd\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Üdv a Dreamjobson - keressük Magyarország Szerethető Munkahelyeit!🤍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Örülünk hogy itt vagy! Sikeresen regisztráltad szerkesztői fiókodát a Dreamjobs-hoz!\u003c/p>\u003cp>\u003cstrong>Mi a következő lépés?\u003c/strong>\u003c/p>\u003cp>1. \u003cstrong>Hozd létre céges profilod\u003c/strong>: Használj különböző szolgáltatásokat a Dashboardon keresztül.\u003c/p>\u003cp>2. \u003cstrong>Tedd közzé első hirdetésed\u003c/strong>: Élj a DreamJobs előnyeivel és szolgáltatásaival.\u003c/p>\u003cp>3. \u003cstrong>Élvezd a DreamJobs nyújtotta előnyöket\u003c/strong>\u003c/p>\u003cp>Új regisztrálóként szeretnénk \u003cstrong>egy egyszeri 50%-os kedvezménykuponnal\u003c/strong> meglepni, hogy a lehető legjobban kihasználhasd az első hirdetésed értékét!\u003c/p>\u003cp>Kedvezményes kuponod az \u003cstrong>Espresso, Latte, Cappuccino és Cappuccino Extra\u003c/strong> hirdetési csomagjainkra is felhasználhatod \u003cstrong>egy hónapon\u003c/strong> belül.\u003c/p>\u003cp>\u003cstrong>Szerethető Munkahelyek Díj 2024: Mi így teszünk egy jobb világért\u003c/strong>\u003c/p>\u003cp>Publikált céges profiloddal ingyenesen nevezhetsz a Szerethető Munkahelyek versenyünkre...\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>4.7 Email de bun venit manager (campanie SZMD)\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>manager-welcome-szmd\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Bine ai venit pe DreamJobs - căutăm Locuri de muncă iubibile din România! 🤍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Ne bucurăm că ești alături de noi! Ți-ai înregistrat cu succes contul de editor pe DreamJobs!\u003c/p>\u003cp>\u003cstrong>Care este pasul următor?\u003c/strong>\u003c/p>\u003cp>1. \u003cstrong>Creează-ți profilul de companie\u003c/strong>: Folosește diferite servicii prin intermediul panoului de control.\u003c/p>\u003cp>2. \u003cstrong>Publică primul tău anunț\u003c/strong>: Profitați de avantajele și serviciile DreamJobs.\u003c/p>\u003cp>3. \u003cstrong>Bucurați-vă de avantajele DreamJobs\u003c/strong>\u003c/p>\u003cp>Ca nou înregistrat, dorim să te surprindem cu \u003cstrong>un cupon de 50% reducere unic\u003c/strong>, pentru a valorifica la maximum primul tău anunț!\u003c/p>\u003cp>Cuponul de reducere poate fi utilizat pentru pachetele noastre de anunțuri \u003cstrong>Espresso, Latte, Cappuccino și Cappuccino Extra\u003c/strong> în termen de \u003cstrong>o lună\u003c/strong>.\u003c/p>\u003cp>\u003cstrong>Locuri de Muncă Iubibile :szmd_year: Misiunea noastră pentru un viitor mai bun\u003c/strong>\u003c/p>\u003cp>Cu profilul tău de companie publicat, te poți înregistra gratuit la concursul nostru Locuri de Muncă Iubibile...\u003c/p>\u003c/blockquote>","auditIds":[9]},{"id":39,"section":"4.8","trigger":"Company blog post proposal","origin":"dj","handler":"CompanyBlogPostProposalListener → CompanyBlogPostNotification","recipient":"Company","type":"Engagement — Blog Proposal","template":"mail.company_blog_post ✅","status":"Törölhető / letiltható","priority":"Közepes","title":"Cégblogcikk lehetőség értesítő","huTitle":"4.8 Cégblogcikk lehetőség értesítő","roTitle":"4.8 Oportunitate articol blog companie","huHtml":"\u003ch3>4.8 Cégblogcikk lehetőség értesítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>company-blog-post\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>Álomállások blogcikk lehetőség :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Bevezetés:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Köszönjük, hogy nálunk hirdetsz! A most indított :coupon hirdetésben foglalt blog-cikk opció kapcsán keresünk az alábbi álláshirdetésed kapcsán:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Üzenet:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>A hatékony jelentkező számhoz érdemes kihasználni a DreamJobs blog Álommelók rovata adta lehetőséget. A tapasztalatok szerint a blogcikk által átlag plusz \u003cstrong>10-15%-al nő a jelentkezők száma\u003c/strong>...\u003c/p>\u003cp>Mit kell tenned? Mellékeltünk egy rövid KÉRDÉSSORT. Töltesd ki a meghirdetett pozícióhoz hasonló munkakörben lévő kollégával...\u003c/p>\u003cp>Amennyiben szeretnétek élni a blogcikk megjelenés lehetőségével, küldjétek el a válaszaitokat az általatok relevánsnak tartott kérdésekre \u003cstrong>7 napon belül\u003c/strong>...\u003c/p>\u003c/blockquote>","roHtml":"\u003ch3>4.8 Oportunitate articol blog companie\u003c/h3>\u003cp>\u003cstrong>Sursă:\u003c/strong> \u003ccode>dj/lang/ro/mail.php\u003c/code> → \u003ccode>company-blog-post\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câmp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>DreamJobs oportunitate de articol joburi de vis :job\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Introducere:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Îți mulțumim că publici la noi! Referitor la opțiunea articol de blog inclusă în anunțul :coupon pe care tocmai l-ai lansat, te contactăm în legătură cu următorul anunț de job:\u003c/p>\u003c/blockquote>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>Pentru a obține un număr eficient de candidați, este recomandat să valorifici oportunitatea oferită de rubrica DreamJobs Joburi de Vis. Experiența arată că articolul de blog crește numărul de candidați cu o medie de \u003cstrong>10-15%\u003c/strong> în plus...\u003c/p>\u003c/blockquote>","auditIds":[46]},{"id":40,"section":"4.9","trigger":"Profile deleted confirmation","origin":"dj-nuxt → dj-api","handler":"ProfileDeleted event → SendProfileDeletionNotification → ProfileDeletionNotification","recipient":"User","type":"Transactional — Deletion Confirmed","template":"mail/profile_deleted.blade.php ✅","status":"Nem törölhető","priority":"Magas","title":"Profil törlése megerősítő","huTitle":"4.9 Profil törlése megerősítő","roTitle":"4.9 Confirmare ștergere profil","huHtml":"\u003ch3>4.9 Profil törlése megerősítő\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code> | \u003ccode>dj-api/lang/hu/mail.php\u003c/code> → \u003ccode>profile-delete\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy (dj)\u003c/strong>\u003c/td>\u003ctd>Adattörlés DreamJo.bs rendszerből\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Tárgy (dj-api)\u003c/strong>\u003c/td>\u003ctd>Felhasználói adattörlés a DreamJobs rendszerből!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Üzenet (dj):\ mp\u003c/th>\u003cth>Conținut\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Subiect\u003c/strong>\u003c/td>\u003ctd>Sunteți un loc de muncă lovable? Înregistrați-vă acum!\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Mesaj:\u003c/strong>\u003c/p>\u003cblockquote>\u003cp>În :szmd_year lansăm concursul Lovable Workplaces pentru al șaselea an consecutiv! Anul acesta 30 de companii vor primi premiul Lovable Workplaces, dintre care 6 vor fi selectate de juriu pentru premiile profesionale speciale în categoriile HR și Employer Branding. Intrarea începe astăzi!\u003c/p>\u003cp>Tema concursului Lovable Workplaces din acest an este: \u003cstrong>Creșterea digitalizării în lumea muncii. Arată-ne care sunt soluțiile tale digitale preferate\u003c/strong>: adaugă-le la profilul tău!\u003c/p>\u003cp>Rolul soluțiilor digitale a crescut rapid în ultimii ani, în special în lumea muncii...\u003c/p>\u003cp>Ținem pumnii pentru voi, așteptăm să vă vedem printre câștigătorii noștri în :szmd_year!\u003c/p>\u003c/blockquote>","auditIds":[54]},{"id":63,"section":"8.1","trigger":"SBP profile created","origin":"dj-api","handler":"SbpProfileCreatedNotification (controller/service)","recipient":"User","type":"Transactional — SBP Welcome","template":"*(internal template)* ✅","status":"Nem törölhető","priority":"Magas","title":"SBP profil nyilvánosságba kerülve","huTitle":"8.1 SBP profil nyilvánosságba kerülve","roTitle":"8.1 Profil SBP adăugat în baza de date publică","huHtml":"\u003ch3>8.1 SBP profil nyilvánosságba kerülve\u003c/h3>\u003cp>\u003cstrong>Forrás:\u003c/strong> \u003ccode>dj/lang/hu/mail.php\u003c/code> → \u003ccode>sbp-b2c\u003c/code>\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mező\u003c/th>\u003cth>Tartalom\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Tárgy\u003c/strong>\u003c/td>\u003ctd>😱 Most már közvetlenül is kaphatsz állásajánlatot! Frissítsd a pro function emailAudience(email){

  // Ha az emailben szerepel az „álláskereső” vagy „álláskeresők” szó, minden esetben B2C.
  if(/álláskereső|álláskeresők/i.test(text))return 'B2C';
  const b2b=/(compan(y|ies)|cég|ceg|manager|employer|recruit|hr|admin|dashboard|billing|invoice|számla|szamla|job plan|hirdetés|hirdetes|partner|business|account manager|company owner)/i.test(text);

  if(b2b)return 'B2B';

function renderDetail(){const email=emails.find(item=>item.id===selected)||emails[0];if(!email){detail.innerHTML='<div class="empty">Nincs kiválasztott email.</div>';return}const audit='Trigger: '+email.trigger+'\n\nForrás: '+email.origin+'\n\nKezelő komponens: '+email.handler+'\n\nCímzett: '+email.recipient+'\n\nEmail típus: '+email.type+'\n\nSablon / osztály: '+email.template;const body=activeTab==='ro'?highlightLegacy(email.roHtml):activeTab==='audit'?'<div class="audit-view">'+highlightLegacy(esc(audit))+'</div>':highlightLegacy(email.huHtml);detail.innerHTML='<section class="detail-head"><span class="eyebrow">EMAIL #'+email.id+' · '+esc(email.section)+'</span><h2>'+esc(email.huTitle||email.roTitle||'Email')+'</h2><p class="audit-trigger">'+esc(email.trigger||'')+'</p><label class="detail-select-row"><input id="detailSelect" type="checkbox" '+(selectedEmails.has(email.id)?'checked':'')+'> Törlési listához kijelölve</label><div class="detail-tags"><span class="tag '+clsStatus(email.status)+'">'+esc(email.status)+'</span><span class="tag '+clsPriority(email.priority)+'">'+esc(email.priority)+'</span><span class="tag '+clsAudience(emailAudience(email))+'">'+esc(emailAudience(email))+'</span>'+(hasLegacy(email)?'<span class="tag status-change">Módosítás szükséges</span>':'')+'</div>'+(hasLegacy(email)?'<div class="legacy-alert"><b>Módosítás szükséges:</b> az emailben még szerepel a régi DreamJo.bs megnevezés vagy hivatkozás.</div>':'')+'<div class="meta-grid"><div class="meta-item"><b>Címzett</b><span>'+esc(email.recipient)+'</span></div><div class="meta-item"><b>Célcsoport</b><span>'+esc(emailAudience(email))+'</span></div><div class="meta-item"><b>Forrás repo</b><span>'+esc(email.origin)+'</span></div><div class="meta-item"><b>Kezelő komponens</b><span>'+esc(email.handler)+'</span></div><div class="meta-item"><b>Sablon / osztály</b><span>'+esc(email.template)+'</span></div></div></section><section class="viewer"><div class="tabs"><button class="tab '+(activeTab==='hu'?'active':'')+'" data-tab="hu">Magyar</button><button class="tab '+(activeTab==='ro'?'active':'')+'" data-tab="ro">Román</button><button class="tab '+(activeTab==='audit'?'active':'')+'" data-tab="audit">Audit</button></div><div class="viewer-content">'+body+'</div></section>';detail.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{activeTab=button.dataset.tab;renderDetail()});document.getElementById('detailSelect').onchange=event=>{if(event.target.checked)selectedEmails.add(email.id);else selectedEmails.delete(email.id);renderSelectionPanel();renderList();renderDetail()}}
function refresh(){const rows=filtered();if(rows.length&&!rows.some(email=>email.id===selected))selected=rows[0].id;renderList();renderSelectionPanel();renderDetail()}
function normAnchorText(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function resolveDocAnchor(hash){const raw=decodeURIComponent(String(hash||'').replace(/^#/,''));if(!raw)return '';if(document.getElementById(raw))return raw;const normalized=normAnchorText(raw);const current=(document.querySelector('.view-button.active')?.dataset.view)||'';const candidates=[current+'-'+normalized,normalized];for(const id of candidates){if(document.getElementById(id))return id}const headings=[...docContent.querySelectorAll('h1,h2,h3,h4')];const direct=headings.find(h=>normAnchorText(h.textContent)===normalized);if(direct)return direct.id;const suffix=headings.find(h=>h.id&&h.id.endsWith('-'+normalized));return suffix?suffix.id:''}
function scrollToDocAnchor(hash){const id=resolveDocAnchor(hash);if(!id)return false;const target=document.getElementById(id);if(!target)return false;target.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+id);return true}
function bindDocAnchors(){docsView.querySelectorAll('a[href^="#"]').forEach(link=>{link.onclick=event=>{if(scrollToDocAnchor(link.getAttribute('href')))event.preventDefault()}})}
function clearDocHighlights(){docContent.querySelectorAll('mark.doc-match').forEach(mark=>mark.replaceWith(document.createTextNode(mark.textContent)))}
function applyDocSearch(){clearDocHighlights();const q=docSearch.value.trim().toLowerCase();if(!q){docSearchMeta.textContent='';return}const walker=document.createTreeWalker(docContent,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);let count=0;for(const node of nodes){const value=node.nodeValue,low=value.toLowerCase();let at=low.indexOf(q),from=0;if(at<0)continue;const fragment=document.createDocumentFragment();while(at>=0){fragment.append(document.createTextNode(value.slice(from,at)));const mark=document.createElement('mark');mark.className='doc-match';mark.textContent=value.slice(at,at+q.length);fragment.append(mark);count++;from=at+q.length;at=low.indexOf(q,from)}fragment.append(document.createTextNode(value.slice(from)));node.replaceWith(fragment)}docSearchMeta.textContent=count+' találat'}
function decorateInlineToc(){docContent.querySelectorAll('h2,h3').forEach(heading=>{if(heading.textContent.trim().toLowerCase()==='table of contents'){let el=heading.nextElementSibling;while(el&&(el.tagName==='OL'||el.tagName==='UL')){el.classList.add('inline-toc');el=el.nextElementSibling}}})}
function openAppView(view){
  document.body.classList.remove('mobile-detail-open');
  document.querySelectorAll('.view-button').forEach(button=>button.classList.toggle('active',button.dataset.view===view));

  const showCatalog=()=>{
    docsView.hidden=true;
    docsView.setAttribute('hidden','');
    docsView.style.setProperty('display','none','important');
    catalogView.hidden=false;
    catalogView.removeAttribute('hidden');
    catalogView.style.removeProperty('display');
  };
  const showDocs=()=>{
    catalogView.hidden=true;
    catalogView.setAttribute('hidden','');
    catalogView.style.setProperty('display','none','important');
    docsView.hidden=false;
    docsView.removeAttribute('hidden');
    docsView.style.removeProperty('display');
  };

  if(view==='catalog'){
    showCatalog();
    window.scrollTo({top:0,behavior:'auto'});
    return;
  }

  const doc=fullDocuments[view];
  if(!doc)return;
  showDocs();
  document.getElementById('docTitle').textContent=doc.label;
  document.getElementById('docNavTitle').textContent=doc.label;
  docContent.innerHTML=highlightLegacy(doc.html||'');
  decorateInlineToc();
  docToc.innerHTML=(doc.toc||[]).map(item=>'<a class="level-'+item.level+'" href="#'+item.id+'">'+esc(item.title)+'</a>').join('');
  bindDocAnchors();
  docSearch.value='';
  docSearchMeta.textContent='';
  window.scrollTo({top:0,behavior:'auto'});
}
document.querySelectorAll('.view-button').forEach(button=>button.addEventListener('click',()=>openAppView(button.dataset.view)));
document.getElementById('backToCatalog').addEventListener('click',()=>openAppView('catalog'));
docSearch.addEventListener('input',applyDocSearch);
[search,status,priority,audience,legacy].forEach(control=>control.addEventListener('input',refresh));
renderSummary();refresh();
</script>
<script>
(function(){
  const mobileMQ=window.matchMedia('(max-width: 820px)');
  function isMobile(){ return mobileMQ.matches; }
  function closeMobileDetail(){
    document.body.classList.remove('mobile-detail-open');
    if(isMobile()) window.scrollTo({top:0,behavior:'instant'});
  }
  function openMobileDetail(){
    if(!isMobile()) return;
    document.body.classList.add('mobile-detail-open');
    window.scrollTo({top:0,behavior:'instant'});
  }

  const originalRenderList=renderList;
  renderList=function(){
    originalRenderList();
    list.querySelectorAll('.email-item').forEach(card=>{
      const oldClick=card.onclick;
      card.onclick=function(event){
        if(event.target.closest('.email-check')) return oldClick && oldClick.call(this,event);
        if(oldClick) oldClick.call(this,event);
        openMobileDetail();
      };
      const oldKey=card.onkeydown;
      card.onkeydown=function(event){
        if(oldKey) oldKey.call(this,event);
        if((event.key==='Enter'||event.key===' ') && !event.target.closest('.email-check')) openMobileDetail();
      };
    });
  };

  const originalRenderDetail=renderDetail;
  renderDetail=function(){
    originalRenderDetail();
    if(isMobile() && !detail.querySelector('.mobile-detail-back')){
      const back=document.createElement('button');
      back.type='button';
      back.className='mobile-detail-back';
      back.textContent='← Vissza az emailekhez';
      back.onclick=closeMobileDetail;
      detail.prepend(back);
    }
  };

  document.querySelectorAll('.view-button').forEach(button=>{
    button.addEventListener('click',()=>document.body.classList.remove('mobile-detail-open'));
  });
  mobileMQ.addEventListener?.('change',()=>{
    document.body.classList.remove('mobile-detail-open');
    renderList();renderDetail();
  });

  renderList();renderDetail();
})();
</script>


<script>
(function(){
  const labels={catalog:'Email katalógus',audit:'Technikai audit',hu:'Magyar emailek',ro:'Román emailek'};
  document.querySelectorAll('.view-button').forEach(function(button){
    button.textContent=labels[button.dataset.view]||button.textContent;
    button.onclick=function(event){
      event.preventDefault();
      event.stopPropagation();
      document.body.classList.remove('mobile-detail-open');
      openAppView(button.dataset.view);
    };
  });
})();
</script>
